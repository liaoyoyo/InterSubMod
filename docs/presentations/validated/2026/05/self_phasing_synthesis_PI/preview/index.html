<html lang="zh-TW">
<head>

  <title>Self-Phasing PPT Preview — 15 主 + 8 backup multi-page (v1.7-F)</title>
  <style>/* Self-Phasing PPT Preview — shared style.css
 * Used by index.html (主頁) + slide_XX.html (子頁)
 * Color palette aligned with output.pptx + 03_slide_layout_script.md
 */

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; font-family: "Noto Sans CJK TC", "Source Han Sans TW", "Droid Sans Fallback", "DejaVu Sans", sans-serif;
  background: #F5F5F7; color: #1F2937; line-height: 1.5;
}
h1, h2, h3, h4 { margin: 0 0 0.5em; color: #1E3A8A; }
code { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, Monaco, Consolas, monospace; font-size: 0.92em; }

/* ─── Top bar (used in index.html only) ─── */
header.topbar {
  position: sticky; top: 0; z-index: 100; background: #1E3A8A; color: white;
  padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
header.topbar h1 { color: white; font-size: 18px; margin: 0; font-weight: 600; }
header.topbar .meta { font-size: 13px; opacity: 0.85; }

/* ─── Nav tabs (index.html) ─── */
nav.slidetabs {
  position: sticky; top: 60px; z-index: 99; background: #FFFFFF; padding: 8px 16px;
  border-bottom: 1px solid #E5E7EB; display: flex; gap: 6px; overflow-x: auto; flex-wrap: wrap;
}
nav.slidetabs button {
  background: #F3F4F6; border: 1px solid #D1D5DB; color: #374151; padding: 8px 14px;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: normal;
  min-width: 110px; min-height: 38px; line-height: 1.3; text-align: center;
  transition: all 0.15s;
}
nav.slidetabs button:hover { background: #E5E7EB; border-color: #9CA3AF; }
nav.slidetabs button.active { background: #1E3A8A; color: white; border-color: #1E3A8A; }
nav.slidetabs .nav-arrow { background: #FBBF24; color: #78350F; font-weight: 600; padding: 6px 14px; border: 1px solid #F59E0B; }
nav.slidetabs .nav-star { background: #FEE2E2; color: #DC2626; font-weight: 600; border: 1px solid #DC2626; }
nav.slidetabs .nav-backup { background: #F3E8FF; color: #6D28D9; font-style: italic; }

/* ─── Iframe wrapper ─── */
.iframe-wrap {
  max-width: 1280px; margin: 16px auto; padding: 0 16px;
}
.iframe-wrap iframe {
  width: 100%; height: calc(100vh - 200px); min-height: 720px;
  border: 1px solid #D1D5DB; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  background: white;
}

/* ─── Slide page (slide_XX.html) ─── */
main.slide-page { max-width: 1280px; margin: 0 auto; padding: 24px; }
.slide-meta {
  background: #FFFFFF; padding: 12px 16px; margin-bottom: 14px; border-radius: 8px;
  border-left: 4px solid #1E3A8A; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  font-size: 12px;
}
.slide-meta .label { color: #6B7280; font-weight: 500; }
.slide-meta .value { color: #111827; margin-left: 4px; font-weight: 600; }
.slide-meta.critical { border-left-color: #DC2626; }

/* ─── 16:9 canvas ─── */
.slide-canvas {
  background: white; border: 1px solid #D1D5DB; border-radius: 8px; aspect-ratio: 16 / 9;
  padding: 28px 40px; position: relative; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  overflow: hidden; color: #1F2937;
}
.slide-canvas h2.slide-title {
  font-size: 30px; color: #1E3A8A; margin: 0;
  border-bottom: 2px solid #1E3A8A; padding-bottom: 2px;
}
.slide-canvas h2.slide-title.critical { color: #DC2626; border-bottom-color: #DC2626; }
.slide-canvas .en-subtitle {
  font-size: 14px; color: #6B7280; font-style: italic;
  margin: 0 0 6px; padding: 0 0 0 1em;
}
.slide-canvas .footer-glossary {
  position: absolute; bottom: 10px; left: 28px; right: 28px;
  font-size: 14px; color: #6B7280; border-top: 1px solid #E5E7EB; padding-top: 6px;
  display: flex; flex-wrap: wrap; gap: 12px;
}
.slide-canvas .footer-glossary .gloss-item {
  background: #FAFAFA; padding: 2px 8px; border-radius: 4px;
}
.slide-canvas .footer-glossary .gloss-item .term { font-weight: 600; color: #374151; }

/* ─── Layout helpers ─── */
.grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0; }
.grid-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 10px 0; }

.stat-box {
  background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 14px; text-align: center;
}
.stat-box .number { font-size: 32px; font-weight: 700; color: #1E3A8A; line-height: 1.1; }
.stat-box .number.green { color: #16A34A; }
.stat-box .number.orange { color: #9A3412; }
.stat-box .label { font-size: 15px; color: #6B7280; margin-top: 6px; }

.caveat-box {
  background: #FFF3CD; border: 1px solid #F59E0B; border-radius: 6px; padding: 10px 14px;
  margin: 10px 0; color: #78350F; font-size: 16px;
}
.caveat-box .label { font-weight: 700; color: #92400E; margin-right: 6px; }
.caveat-box .en-note {
  display: block; margin-top: 4px; padding-left: 1em; font-size: 11px;
  font-style: italic; color: #92400E; opacity: 0.8;
}

.red-frame {
  background: #FEE2E2; border: 2px solid #DC2626; border-radius: 6px; padding: 12px 16px;
  margin: 10px 0; color: #7F1D1D; font-size: 16px; font-weight: 500;
}
.red-frame .label { color: #DC2626; font-weight: 700; }

.green-box {
  background: #DCFCE7; border: 1px solid #16A34A; border-radius: 6px; padding: 10px 14px;
  margin: 10px 0; color: #166534; font-size: 16px;
}

table.metric-table { width: 100%; border-collapse: collapse; font-size: 16px; margin: 8px 0; }
table.metric-table th, table.metric-table td {
  padding: 6px 10px; border: 1px solid #E5E7EB; text-align: left;
}
table.metric-table th { background: #F3F4F6; font-weight: 600; color: #374151; text-align: center; }
table.metric-table td.num { text-align: center; font-family: monospace; }
table.metric-table td.center { text-align: center; }
table.metric-table tr.row-red td { background: #FEE2E2; color: #7F1D1D; }
table.metric-table tr.row-green td { background: #DCFCE7; color: #166534; }
table.metric-table tr.row-yellow td { background: #FEF3C7; }

/* ─── IGV zoomable thumbnail ─── */
.igv-zoom-wrap {
  position: relative; overflow: hidden; border-radius: 6px;
  display: inline-block; width: 100%;
}
.igv-zoom-wrap a { display: block; cursor: zoom-in; }
.igv-zoom-wrap img.igv-thumb {
  width: 100%; transition: transform 0.25s ease-out; display: block;
}
.igv-zoom-wrap:hover img.igv-thumb {
  transform: scale(1.8); transform-origin: center center; z-index: 50;
  position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
/* PanZoom enhancement loaded → disable CSS hover scale (panzoom handles wheel/drag) */
.igv-zoom-wrap.has-panzoom { overflow: hidden; cursor: grab; }
.igv-zoom-wrap.has-panzoom:hover img.igv-thumb {
  transform: none; box-shadow: none; z-index: auto; position: static;
}
.igv-pz-reset {
  position: absolute; bottom: 8px; right: 8px; z-index: 52;
  background: rgba(30, 58, 138, 0.9); color: white; border: none;
  padding: 4px 10px; border-radius: 4px; font-size: 11px;
  cursor: pointer; font-weight: 600;
}
.igv-pz-reset:hover { background: rgba(30, 58, 138, 1); }
.igv-zoom-hint {
  position: absolute; top: 6px; right: 8px; z-index: 51;
  background: rgba(30, 58, 138, 0.85); color: white;
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
  pointer-events: none;
}
.igv-focus-callout {
  background: #FEF9C3; border: 1.5px solid #CA8A04; border-radius: 6px;
  padding: 8px 14px; margin-top: 6px; font-size: 15px; color: #713F12;
}
.igv-focus-callout .label { color: #92400E; font-weight: 700; margin-right: 6px; }

.arg-list {
  background: #F0F9FF; border-left: 3px solid #0EA5E9; border-radius: 4px;
  padding: 10px 16px; margin: 12px 0; font-size: 17px; line-height: 1.55;
}
.conclusion-arrow {
  background: linear-gradient(90deg, #1E3A8A, #3B82F6); color: white;
  padding: 12px 18px; margin: 12px 0; border-radius: 6px; font-weight: 600; font-size: 17px;
}
.conclusion-arrow.green { background: linear-gradient(90deg, #16A34A, #22C55E); }
.cliffhanger-box {
  background: #FEF3C7; border: 1.5px dashed #F59E0B; padding: 10px 16px;
  margin: 10px 0; border-radius: 6px; color: #78350F; font-style: italic; font-size: 17px;
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }

.code-panel {
  font-family: monospace; font-size: 11px; padding: 8px 10px; border-radius: 4px;
  white-space: pre-wrap; line-height: 1.4; margin: 4px 0;
}
.code-panel.baseline { background: #FEE2E2; border: 1px solid #FCA5A5; }
.code-panel.v3f      { background: #DCFCE7; border: 1px solid #86EFAC; }
.code-panel.v5       { background: #DCFCE7; border: 1px solid #86EFAC; position: relative; }
.code-panel.v5::after {
  content: "⚠ Layer 1.5"; position: absolute; top: 4px; right: 6px;
  background: #FEF3C7; color: #78350F; padding: 1px 6px; border-radius: 3px; font-size: 10px;
}
.code-label { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
.code-label.baseline { color: #DC2626; }
.code-label.v3f      { color: #16A34A; }
.code-label.v5       { color: #16A34A; }

.fig-thumb {
  width: 100%; max-height: 380px; object-fit: contain;
  border: 1px solid #D1D5DB; border-radius: 4px; background: #FAFAFA;
}
.igv-thumb {
  width: 100%; max-height: 320px; object-fit: contain;
  border: 1px solid #374151; border-radius: 4px; background: #1F2937;
}
.fig-caption {
  font-size: 10px; color: #6B7280; font-style: italic; text-align: center; margin-top: 2px;
}

/* ─── Speaker note collapsible (slide_XX.html) ─── */
.note-section {
  margin-top: 20px; background: #FAFBFE; border: 1px solid #C7D2FE;
  border-left: 4px solid #8B5CF6; border-radius: 8px; padding: 14px 18px;
}
.note-section h3 { color: #6D28D9; margin: 0 0 8px; font-size: 14px; }
.note-section .timing {
  background: #EDE9FE; padding: 4px 10px; border-radius: 4px; font-size: 11px;
  color: #6D28D9; display: inline-block; margin-bottom: 10px; font-weight: 600;
}
.note-section .speak-text { font-size: 14px; line-height: 1.7; color: #1F2937; white-space: pre-line; }
.note-section .tier3 {
  margin-top: 12px; padding: 8px 12px; border-radius: 4px;
  background: #F9FAFB; border: 1px dashed #9CA3AF;
  font-size: 11px; color: #6B7280;
}
.note-section .tier3 .label { font-weight: 700; color: #374151; margin-right: 4px; }

details.collapsible summary {
  cursor: pointer; padding: 6px 0; font-size: 13px; font-weight: 600; color: #1E3A8A;
}
details.collapsible summary:hover { color: #1D4ED8; }

/* ─── Cross-link card to 03_slide_layout_script.md ─── */
.cross-link {
  margin-top: 12px; padding: 8px 14px; background: #FFFBEB;
  border: 1px solid #FBBF24; border-radius: 4px; font-size: 12px; color: #78350F;
}
.cross-link a { color: #92400E; text-decoration: underline; }

/* ─── Bottom nav (slide_XX.html prev/next) ─── */
.nav-bottom {
  display: flex; justify-content: space-between; margin: 20px 0;
  max-width: 1280px; margin-left: auto; margin-right: auto; padding: 0 16px;
}
.nav-bottom a {
  background: #1E3A8A; color: white; text-decoration: none;
  padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500;
}
.nav-bottom a.disabled { opacity: 0.4; pointer-events: none; }
.nav-bottom a:hover { background: #1E40AF; }
.nav-bottom .counter { align-self: center; color: #6B7280; font-size: 12px; }

.kbd-hint {
  position: fixed; bottom: 12px; left: 12px; background: rgba(0,0,0,0.7); color: white;
  padding: 6px 12px; border-radius: 4px; font-size: 11px; pointer-events: none;
}
.kbd-hint kbd {
  background: white; color: #1F2937; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin: 0 2px;
}

/* ─── Section-based color theming (2026-05-13) ─────────────────────── */
.slide-canvas[data-section="S0"] h1.slide-title,
.slide-canvas[data-section="S0"] h2.slide-title { color: #7C3AED; border-bottom-color: #7C3AED; }
.slide-canvas[data-section="S1"] h1.slide-title,
.slide-canvas[data-section="S1"] h2.slide-title { color: #DC2626; border-bottom-color: #DC2626; }
.slide-canvas[data-section="S2"] h1.slide-title,
.slide-canvas[data-section="S2"] h2.slide-title { color: #EA580C; border-bottom-color: #EA580C; }
.slide-canvas[data-section="S3"] h1.slide-title,
.slide-canvas[data-section="S3"] h2.slide-title { color: #CA8A04; border-bottom-color: #CA8A04; }
.slide-canvas[data-section="S4"] h1.slide-title,
.slide-canvas[data-section="S4"] h2.slide-title { color: #1E3A8A; border-bottom-color: #1E3A8A; }
.slide-canvas[data-section="S5"] h1.slide-title,
.slide-canvas[data-section="S5"] h2.slide-title { color: #16A34A; border-bottom-color: #16A34A; }
.slide-canvas[data-section="S7"] h1.slide-title,
.slide-canvas[data-section="S7"] h2.slide-title { color: #B45309; border-bottom-color: #B45309; }
.slide-canvas[data-section="Q&A"] h1.slide-title,
.slide-canvas[data-section="Q&A"] h2.slide-title { color: #6B7280; border-bottom-color: #6B7280; }

/* Section meta badge in upper-right corner of canvas */
.slide-canvas::before {
  content: attr(data-section);
  position: absolute; top: 8px; right: 28px;
  font-size: 11px; font-weight: 600; padding: 3px 10px;
  border-radius: 12px; color: white; opacity: 0.9;
}
.slide-canvas[data-section="S0"]::before { background: #7C3AED; }
.slide-canvas[data-section="S1"]::before { background: #DC2626; }
.slide-canvas[data-section="S2"]::before { background: #EA580C; }
.slide-canvas[data-section="S3"]::before { background: #CA8A04; }
.slide-canvas[data-section="S4"]::before { background: #1E3A8A; }
.slide-canvas[data-section="S5"]::before { background: #16A34A; }
.slide-canvas[data-section="S7"]::before { background: #B45309; }
.slide-canvas[data-section="Q&A"]::before { background: #6B7280; }
.slide-canvas.cover-slide::before { display: none; }

/* Speaker note teleprompter format — handle newlines */
.note-section .speak-text { white-space: pre-line !important; }
</style>
</head>
