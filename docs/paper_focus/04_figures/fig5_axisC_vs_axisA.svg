<svg viewBox="0 0 1180 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="圖 5 · ISM 站哪條軸：read 結構（軸 C） vs 率差（軸 A）"><title>圖 5 · ISM 站哪條軸：read 結構（軸 C） vs 率差（軸 A）</title><desc>與 modkit/DSS 互補；ISM 保留 read-level 結構並做顯著性檢定</desc><rect width="1180" height="430" fill="#FAF9F5"/>
<text x="12.0" y="26.0" font-size="16" fill="#141413" text-anchor="start" font-weight="800">圖 5 · ISM 站哪條軸：read 結構（軸 C） vs 率差（軸 A）</text><text x="12.0" y="46.0" font-size="11.5" fill="#6B6B66" text-anchor="start">與 modkit/DSS 互補；ISM 保留 read-level 結構並做顯著性檢定</text>
<text x="590.0" y="78.0" font-size="13.5" fill="#141413" text-anchor="middle" font-weight="800">同一位點，兩種問法 — 互補，不是「更好」</text>
<rect x="60.0" y="100.0" width="480.0" height="250.0" rx="10" fill="#fff" stroke="#E4E2DA" stroke-width="1.2"/>
<text x="78.0" y="128.0" font-size="13" fill="#1B8A86" text-anchor="start" font-weight="800">軸 A · per-position 率差</text>
<text x="78.0" y="148.0" font-size="10.5" fill="#6B6B66" text-anchor="start">modkit dmr · DSS · methylKit</text>
<text x="78.0" y="174.0" font-size="10.5" fill="#141413" text-anchor="start">把 reads 塌成「每個位點的甲基 %」，比兩組率差</text>
<text x="78.0" y="212.0" font-size="10.5" fill="#2F5597" text-anchor="start" font-weight="700">HP1</text>
<rect x="150.0" y="196.0" width="300.0" height="22.0" rx="4" fill="#eee"/>
<rect x="150.0" y="196.0" width="186.0" height="22.0" rx="4" fill="#2F5597"/>
<text x="344.0" y="212.0" font-size="10" fill="#2F5597" text-anchor="start" font-weight="700">62%</text>
<text x="78.0" y="258.0" font-size="10.5" fill="#C55A11" text-anchor="start" font-weight="700">HP1-1</text>
<rect x="150.0" y="242.0" width="300.0" height="22.0" rx="4" fill="#eee"/>
<rect x="150.0" y="242.0" width="150.0" height="22.0" rx="4" fill="#C55A11"/>
<text x="308.0" y="258.0" font-size="10" fill="#C55A11" text-anchor="start" font-weight="700">50%</text>
<text x="78.0" y="300.0" font-size="10.5" fill="#141413" text-anchor="start" font-weight="700">輸出：Δ 率差（一個數）</text>
<text x="78.0" y="320.0" font-size="10" fill="#9a6212" text-anchor="start">→ 看不到 read 內部結構</text>
<rect x="640.0" y="100.0" width="480.0" height="250.0" rx="10" fill="#fff" stroke="#E4E2DA" stroke-width="1.2"/>
<text x="658.0" y="128.0" font-size="13" fill="#B8860B" text-anchor="start" font-weight="800">軸 C · read-to-read 結構（ISM）</text>
<text x="658.0" y="148.0" font-size="10.5" fill="#6B6B66" text-anchor="start">ISM · cvlr · ASMS · qFDRP</text>
<text x="658.0" y="174.0" font-size="10.5" fill="#141413" text-anchor="start">保留 read×CpG，問「reads 是否分成可分離亞群」</text>
