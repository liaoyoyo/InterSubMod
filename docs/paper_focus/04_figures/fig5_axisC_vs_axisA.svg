<text x="658.0" y="300.0" font-size="10.5" fill="#141413" text-anchor="start" font-weight="700">輸出：PERMANOVA 結構顯著性 + 距離矩陣</text>
<text x="658.0" y="320.0" font-size="10" fill="#141413" text-anchor="start">→ 保留誰跟誰像（結構）</text>
<text x="590.0" y="372.0" font-size="10" fill="#141413" text-anchor="middle">✅ modkit 已交叉驗證率差層 r≈0.98（同方向同量級）　🔴 discordant-case（率差≈0 但結構顯著）未跑＝硬傷　·　鐵則：組合無人佔 ≠ 更好</text>
<text x="60.0" y="404.0" font-size="9.5" fill="#9a6212" text-anchor="start" font-weight="700">▣ label-flip：HP1-1 ≡ HP1 上帶 somatic ALT 的子單倍型（非第三 haplotype）。</text>
<text x="1168.0" y="420.0" font-size="9" fill="#9a6212" text-anchor="end">示意 schematic — 分子為 synthetic，非真實資料</text>
