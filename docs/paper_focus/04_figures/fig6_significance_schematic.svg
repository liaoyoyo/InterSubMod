<svg viewBox="0 0 1180 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="圖 6 · 顯著判定流程（雙向驗證，示意）"><title>圖 6 · 顯著判定流程（雙向驗證，示意）</title><desc>切群↔標籤雙向檢查；Strand 不顯著＝甲基分群不跟定序股別走</desc><rect width="1180" height="420" fill="#FAF9F5"/>
<text x="12.0" y="26.0" font-size="16" fill="#141413" text-anchor="start" font-weight="800">圖 6 · 顯著判定流程（雙向驗證，示意）</text><text x="12.0" y="46.0" font-size="11.5" fill="#6B6B66" text-anchor="start">切群↔標籤雙向檢查；Strand 不顯著＝甲基分群不跟定序股別走</text>
<text x="12.0" y="70.0" font-size="12.5" fill="#141413" text-anchor="start" font-weight="700">雙向驗證：① 切群 → 看群是否對齊標籤　② 依標籤 → 看群內外是否顯著</text>
