<text x="1016.0" y="205.0" font-size="9.5" fill="#6B6B66" text-anchor="start">分群跟著單倍型走</text>
<text x="530.0" y="249.0" font-size="11" fill="#141413" text-anchor="start" font-weight="700">Strand</text>
