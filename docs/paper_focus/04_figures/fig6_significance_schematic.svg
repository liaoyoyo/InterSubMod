<text x="76.0" y="116.0" font-size="12" fill="#1B8A86" text-anchor="start" font-weight="800">① 依組距離切群（k 掃描）</text>
<text x="84.0" y="150.0" font-size="11" fill="#141413" text-anchor="start" font-weight="700">k=2</text>
<rect x="140.0" y="138.0" width="40.0" height="16.0" rx="3" fill="#2F5597"/>
<rect x="184.0" y="138.0" width="40.0" height="16.0" rx="3" fill="#C55A11"/>
<text x="84.0" y="206.0" font-size="11" fill="#141413" text-anchor="start" font-weight="700">k=3</text>
<rect x="140.0" y="194.0" width="40.0" height="16.0" rx="3" fill="#2F5597"/>
<rect x="184.0" y="194.0" width="40.0" height="16.0" rx="3" fill="#C55A11"/>
<rect x="228.0" y="194.0" width="40.0" height="16.0" rx="3" fill="#1B8A86"/>
<text x="84.0" y="262.0" font-size="11" fill="#141413" text-anchor="start" font-weight="700">k=6</text>
<rect x="140.0" y="250.0" width="40.0" height="16.0" rx="3" fill="#2F5597"/>
<rect x="184.0" y="250.0" width="40.0" height="16.0" rx="3" fill="#C55A11"/>
<rect x="228.0" y="250.0" width="40.0" height="16.0" rx="3" fill="#1B8A86"/>
<rect x="272.0" y="250.0" width="40.0" height="16.0" rx="3" fill="#B8860B"/>
<rect x="316.0" y="250.0" width="40.0" height="16.0" rx="3" fill="#8FAADC"/>
<rect x="360.0" y="250.0" width="40.0" height="16.0" rx="3" fill="#ED9B6A"/>
<text x="84.0" y="300.0" font-size="10" fill="#6B6B66" text-anchor="start">→ 每種 k 都檢查群與標籤的關聯</text>
<path d="M441.0,211.0 L450.0,217.0 L441.0,223.0" fill="#6B6B66"/>
<rect x="510.0" y="92.0" width="610.0" height="250.0" rx="10" fill="#fff" stroke="#E4E2DA" stroke-width="1.2"/>
<text x="526.0" y="116.0" font-size="12" fill="#B8860B" text-anchor="start" font-weight="800">② 依標籤驗證群內外顯著（Fisher + Cramér&#x27;s V）</text>
<text x="530.0" y="161.0" font-size="11" fill="#141413" text-anchor="start" font-weight="700">Allele</text>
<rect x="620.0" y="146.0" width="300.0" height="20.0" rx="4" fill="#eee"/>
