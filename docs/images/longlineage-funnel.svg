        <text x="460" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#5B3FA0">M1 甲基化分群「穩定」的位點</text>
        <text x="460" y="171" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#5B3FA0">12,851</text>
        <text x="460" y="184" text-anchor="middle" font-size="9.5" fill="#5B3FA0">只佔全部的 16.1%</text>
        <path d="M670,162 L742,162" stroke="#9A3B3B" stroke-width="1.8" marker-end="url(#b2)" fill="none"/>
        <rect x="748" y="140" width="180" height="46" rx="5" fill="#F3E2E2" stroke="#9A3B3B" stroke-width="1.5"/>
        <text x="838" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3B3B">66,836 個位點</text>
        <text x="838" y="171" text-anchor="middle" font-size="9.5" fill="#7a3030">在共現層完全沒有任何列</text>
        <text x="838" y="182" text-anchor="middle" font-size="9" fill="#7a3030">（連配對都不會產生）</text>
        <path d="M460,188 L460,206" stroke="#8a8578" stroke-width="1.6" marker-end="url(#b1)" fill="none"/>

