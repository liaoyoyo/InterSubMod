      <title id="l1t">LongLineage 位點流失漏斗</title>
      <desc id="l1d">從 79,687 個凍結的體細胞突變位點開始，78,629 個可評估，
      其中只有 12,851 個通過甲基化穩定分群關卡；這 12,851 個再經第二道關卡後只剩 5 個合格，
      12,815 個被判為資訊不足、31 個被判為確實不合格；共現配對共 134,278 列但其中 134,276 列被前一道關卡擋掉；
      聯合特徵檢定通過 0 個位點，最終拓撲單元為 0。</desc>
