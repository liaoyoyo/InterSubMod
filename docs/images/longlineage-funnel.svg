        <path d="M250,229 L182,229" stroke="#B06A16" stroke-width="1.5" marker-end="url(#b2)" fill="none"/>
        <rect x="12" y="200" width="166" height="58" rx="5" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.1"/>
        <text x="95" y="216" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b4310">資訊不足 12,815</text>
        <text x="95" y="229" text-anchor="middle" font-size="8.5" fill="#6b4310">（不是「被證明是假象」）</text>
        <text x="95" y="245" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9A3B3B">真正判定不合格 31</text>
