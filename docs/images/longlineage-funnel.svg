        <text x="460" y="360" text-anchor="middle" font-size="12" fill="#9A3B3B">聯合特徵檢定通過的位點</text>
        <text x="460" y="377" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#9A3B3B">0</text>
        <path d="M460,384 L460,402" stroke="#8a8578" stroke-width="1.6" marker-end="url(#b1)" fill="none"/>

        <rect x="250" y="404" width="420" height="46" rx="6" fill="#9A3B3B" stroke="#7a3030" stroke-width="2"/>
        <text x="460" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">最終拓撲單元</text>
        <text x="460" y="442" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#fff">0</text>

        <!-- 解說 -->
        <rect x="60" y="474" width="820" height="122" rx="8" fill="#ECE6F6" stroke="#5B3FA0" stroke-width="1.6"/>
        <text x="78" y="496" font-size="12.5" font-weight="800" fill="#5B3FA0">為什麼這件事在科學上很重要</text>
        <text x="78" y="518" font-size="10.5" fill="#3f2c70">直覺會以為「突變共現是獨立的骨幹，甲基化只是旁證」。但在這套實作裡，</text>
        <text x="78" y="534" font-size="10.5" font-weight="700" fill="#5B3FA0">建立共現表的第一件事就是檢查甲基化有沒有分出穩定的群 —— 沒過就直接回空結果。</text>
        <text x="78" y="554" font-size="10.5" fill="#3f2c70">後果：79,687 個位點裡有 66,836 個（83.9%）在共現層根本不存在任何一列。</text>
        <text x="78" y="572" font-size="10.5" font-weight="700" fill="#9A3B3B">因此任何「共現覆蓋率」的解讀，都必須先扣掉這個甲基化前提，否則會嚴重高估。</text>
        <text x="78" y="588" font-size="10" fill="#3f2c70">這也正是它與 InterSubMod「甲基化絕不進重建」立場衝突的地方（見系統全景頁 §2）。</text>
      </g>
