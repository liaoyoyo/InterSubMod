        <text x="460" y="92" text-anchor="middle" font-size="12" fill="#2F6690">M1 可評估（突變型 read 數足夠）</text>
        <text x="460" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#2F6690">78,629</text>
