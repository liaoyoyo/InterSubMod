<?xml version="1.0" encoding="UTF-8"?>
<!-- 五層系統全景：資料 → 上游工具 → 兩支 C++ → Python → HTML
     來源: docs/explain/11_system-map-overview.standalone.html (svg #1)
     由 tools/extract_svg_for_github.py 產生，勿手改；改上游解釋頁後重跑。 -->
<svg viewBox="0 0 980 620" role="img" aria-labelledby="f1t f1d" xmlns="http://www.w3.org/2000/svg">
      <title id="f1t">五層系統全景圖</title>
      <desc id="f1d">由下而上分為原始資料層、上游工具層、中介契約層、兩支 C++ 主程式層、Python 分析與 HTML 呈現層。
      原始 ONT BAM 經 Dorado 產生甲基化標記、ClairS 產生體細胞突變清單、LongPhase-S 產生單倍型標籤並存成 sidecar TSV；
      InterSubMod 與 LongLineage 兩支程式各自讀取這些輸入，前者可跑，後者只有 dataset-gate 子命令可跑；
      輸出再由 Python 層算成統計與圖，最後生成離線可開的 HTML 工作站。</desc>
  <rect x="0" y="0" width="980" height="620" fill="#FAF9F5"/>
      <g font-family="system-ui,-apple-system,'Noto Sans CJK TC',sans-serif" fill="#1c1b19">

        <!-- 層 1 原始資料 -->
        <text x="14" y="30" font-size="12" font-weight="700" fill="#5C5A54">① 原始資料</text>
        <rect x="14" y="38" width="952" height="58" rx="8" fill="#FAF9F5" stroke="#E3DACC"/>
        <rect x="28" y="50" width="170" height="34" rx="5" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.2"/>
        <text x="113" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F6690">tumor BAM（ONT）</text>
        <text x="113" y="79" text-anchor="middle" font-size="9.5" fill="#2F6690">HCC1395 = 283.072 GB</text>
        <rect x="208" y="50" width="150" height="34" rx="5" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.2"/>
        <text x="283" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F6690">normal BAM</text>
        <text x="283" y="79" text-anchor="middle" font-size="9.5" fill="#2F6690">配對正常組織</text>
        <rect x="368" y="50" width="160" height="34" rx="5" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.2"/>
        <text x="448" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F6690">reference FASTA</text>
        <text x="448" y="79" text-anchor="middle" font-size="9.5" fill="#2F6690">GRCh38 + .fai 必備</text>
        <text x="546" y="72" font-size="10.5" fill="#5C5A54">← 這三樣是所有分析的共同起點；BAM 需自帶 MM/ML 甲基化標記</text>

        <!-- 層 2 上游工具 -->
        <text x="14" y="126" font-size="12" font-weight="700" fill="#5C5A54">② 上游工具（都是外部既有軟體，不是本專案寫的）</text>
        <rect x="14" y="134" width="952" height="74" rx="8" fill="#FAF9F5" stroke="#E3DACC"/>
        <rect x="28" y="146" width="164" height="50" rx="5" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.3"/>
        <text x="110" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F7D5B">Dorado basecaller</text>
        <text x="110" y="177" text-anchor="middle" font-size="9.5" fill="#2F7D5B">電訊號 → 鹼基 + 甲基化</text>
        <text x="110" y="190" text-anchor="middle" font-size="9.5" fill="#2F7D5B">產出 MM / ML tag</text>
        <rect x="202" y="146" width="164" height="50" rx="5" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.3"/>
        <text x="284" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F7D5B">ClairS v0.4.0</text>
        <text x="284" y="177" text-anchor="middle" font-size="9.5" fill="#2F7D5B">腫瘤/正常配對比對</text>
        <text x="284" y="190" text-anchor="middle" font-size="9.5" fill="#2F7D5B">產出 somatic SNV VCF</text>
        <rect x="376" y="146" width="176" height="50" rx="5" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.3"/>
        <text x="464" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F7D5B">LongPhase-S</text>
        <text x="464" y="177" text-anchor="middle" font-size="9.5" fill="#2F7D5B">判斷每條 read 來自哪一套染色體</text>
        <text x="464" y="190" text-anchor="middle" font-size="9.5" fill="#2F7D5B">產出 HP / PS tag</text>
        <rect x="562" y="146" width="150" height="50" rx="5" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.3"/>
        <text x="637" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B06A16">SAVANA（cna）</text>
        <text x="637" y="177" text-anchor="middle" font-size="9.5" fill="#B06A16">拷貝數變異</text>
        <text x="637" y="190" text-anchor="middle" font-size="9.5" fill="#B06A16">目前 NOT_INTEGRATED</text>
        <text x="726" y="166" font-size="10.5" fill="#5C5A54">前三個是必要輸入的生產者。</text>
        <text x="726" y="182" font-size="10.5" fill="#B06A16">SAVANA 的 CN 結果尚未接進主線。</text>

        <!-- 層 3 中介契約 -->
        <text x="14" y="238" font-size="12" font-weight="700" fill="#5C5A54">③ 中介契約 — 兩支程式唯一 byte-level 一致的介面</text>
        <rect x="14" y="246" width="952" height="60" rx="8" fill="#ECE6F6" stroke="#5B3FA0" stroke-width="1.4"/>
        <text x="30" y="268" font-size="12" font-weight="700" fill="#5B3FA0">HP/PS sidecar TSV（.tsv.gz + .tbi 索引）</text>
        <text x="30" y="285" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#3f2c70">#CHROM  START0  END0  QNAME  FLAG  MAPQ  CIGAR_B2  HP  PS</text>
        <text x="30" y="299" font-size="10" fill="#5C5A54">每條 read 一列，記錄它落在哪、屬於哪個單倍型。HCC1395 這一份有 40,859,727 列、1.43 GB。</text>
        <rect x="640" y="256" width="310" height="40" rx="5" fill="#fff" stroke="#5B3FA0" stroke-width="1.1"/>
        <text x="654" y="272" font-size="10" fill="#3f2c70">為什麼用 sidecar 而不是直接存 tagged BAM：</text>
        <text x="654" y="287" font-size="10" fill="#3f2c70">7 sidecars = 6,256,168,164 B；tagged-BAM 總量尚無收據</text>

        <!-- 層 4 兩支 C++ -->
        <text x="14" y="336" font-size="12" font-weight="700" fill="#5C5A54">④ 兩支 C++ 主程式（本專案核心）</text>
        <rect x="14" y="344" width="470" height="150" rx="8" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.6"/>
        <text x="30" y="366" font-size="13" font-weight="800" fill="#2F7D5B">InterSubMod（inter_sub_mod）</text>
        <rect x="392" y="352" width="80" height="18" rx="9" fill="#2F7D5B"/>
        <text x="432" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">可跑</text>
        <text x="30" y="385" font-size="10.5" fill="#1f4f3a">研究原型。對每個 somatic SNV 開一個視窗，把跨過它的 read</text>
        <text x="30" y="399" font-size="10.5" fill="#1f4f3a">的甲基化狀態排成矩陣 → 算 read-read 距離 → 分群 → 統計檢定。</text>
        <text x="30" y="418" font-size="10.5" font-weight="700" fill="#1f4f3a">輸出粒度：per-region（每個位點一包結果）</text>
        <text x="30" y="437" font-size="10" fill="#5C5A54">29 個 CLI 選項 · 內部單點命令 exit 0（非 public fixture）</text>
        <rect x="28" y="447" width="440" height="36" rx="5" fill="#fff" stroke="#2F7D5B" stroke-width="1"/>
        <text x="40" y="462" font-size="9.5" fill="#1f4f3a">吃：tumor BAM + reference + somatic VCF（必要）</text>
        <text x="40" y="475" font-size="9.5" fill="#1f4f3a">吐：methylation.csv · distance_matrix · tree.nwk · significance_summary.csv</text>

        <rect x="496" y="344" width="470" height="150" rx="8" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.6"/>
        <text x="512" y="366" font-size="13" font-weight="800" fill="#B06A16">LongLineage（longlineage）</text>
        <rect x="856" y="352" width="96" height="18" rx="9" fill="#B06A16"/>
        <text x="904" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">部分可跑</text>
        <text x="512" y="385" font-size="10.5" fill="#6b4310">工業化重寫版（clean-room，不是 fork）。強制 fail-closed：</text>
        <text x="512" y="399" font-size="10.5" fill="#6b4310">每個輸出都有 schema 與 SHA-256 收據，證據不足就拒絕出結果。</text>
        <text x="512" y="418" font-size="10.5" font-weight="700" fill="#6b4310">輸出粒度：per-read（每條 read 一列）</text>
        <text x="512" y="437" font-size="10" fill="#9A3B3B">run / probe 子命令被鎖 · 只有 dataset-gate 能出科學結果</text>
        <rect x="510" y="447" width="440" height="36" rx="5" fill="#fff" stroke="#B06A16" stroke-width="1"/>
        <text x="522" y="462" font-size="9.5" fill="#6b4310">吃：8 角色 manifest（BAM + VCF + sidecar + reference）</text>
        <text x="522" y="475" font-size="9.5" fill="#6b4310">吐：site_reads · methyl_calls · cooccurrence_* · topology_unit</text>

        <!-- 層 5 Python / HTML -->
        <text x="14" y="524" font-size="12" font-weight="700" fill="#5C5A54">⑤ Python 分析層 → HTML 呈現層</text>
        <rect x="14" y="532" width="952" height="72" rx="8" fill="#FAF9F5" stroke="#E3DACC"/>
        <rect x="28" y="544" width="230" height="48" rx="5" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.2"/>
        <text x="143" y="561" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F6690">Python 分析腳本</text>
        <text x="143" y="575" text-anchor="middle" font-size="9.5" fill="#2F6690">共現骨幹建構 · 分層樹枚舉</text>
        <text x="143" y="588" text-anchor="middle" font-size="9.5" fill="#2F6690">funnel 普查 · 熱圖繪製</text>
        <rect x="268" y="544" width="230" height="48" rx="5" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.2"/>
        <text x="383" y="561" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F7D5B">standalone HTML 工作站</text>
        <text x="383" y="575" text-anchor="middle" font-size="9.5" fill="#2F7D5B">離線可開 · 逐項人工判讀</text>
        <text x="383" y="588" text-anchor="middle" font-size="9.5" fill="#2F7D5B">缺必填值就拒絕渲染</text>
        <rect x="508" y="544" width="442" height="48" rx="5" fill="#fff" stroke="#E3DACC"/>
        <text x="522" y="561" font-size="10.5" fill="#5C5A54">這層是「人真正看的東西」。C++ 只吐檔案，Python 把它變成</text>
        <text x="522" y="575" font-size="10.5" fill="#5C5A54">可以用眼睛檢查的圖與表，並把人工判讀結果存回 localStorage 匯出。</text>
        <text x="522" y="588" font-size="10" fill="#B06A16">⚠ 這層目前最碎片化，見「分析與呈現層」分冊</text>

        <!-- 箭頭 -->
        <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"/></marker></defs>
        <path d="M490,96 L490,132" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
        <path d="M490,208 L490,244" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
        <path d="M250,306 L250,342" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
        <path d="M730,306 L730,342" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
        <path d="M250,494 L250,530" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
        <path d="M730,494 L730,530" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
      </g>
    </svg>
