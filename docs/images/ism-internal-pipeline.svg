<?xml version="1.0" encoding="UTF-8"?>
<!-- InterSubMod 內部八階段處理鏈
     來源: docs/explain/12_intersubmod-io.standalone.html (svg #1)
     由 tools/extract_svg_for_github.py 產生，勿手改；改上游解釋頁後重跑。 -->
<svg viewBox="0 0 960 700" role="img" aria-labelledby="g1t g1d" xmlns="http://www.w3.org/2000/svg">
      <title id="g1t">InterSubMod 內部八階段處理鏈</title>
      <desc id="g1d">從 VCF 載入突變錨點開始，依序為：以突變為中心開視窗、從 BAM 抓取 read、
      read 過濾與單倍型解析、解析甲基化標記組成 read 乘 CpG 矩陣、二值化、計算 read 兩兩距離矩陣、
      剔除含缺失值的 read 後建立 read-level methylation dendrogram（階層分群，非 cellular phylogeny）、以輪廓係數決定群數、最後跑四類顯著性檢定並輸出檔案。</desc>
  <rect x="0" y="0" width="960" height="700" fill="#FAF9F5"/>
      <g font-family="system-ui,-apple-system,'Noto Sans CJK TC',sans-serif" fill="#1c1b19">
        <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"/></marker></defs>

        <!-- S1 -->
        <rect x="250" y="12" width="440" height="46" rx="7" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.5"/>
        <text x="470" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F6690">① 載入突變錨點</text>
        <text x="470" y="49" text-anchor="middle" font-size="10" fill="#2F6690">讀 VCF，每筆突變 = 一個 region</text>
        <text x="706" y="38" font-size="9.5" fill="#5C5A54">用 OpenMP 把 region 分給多執行緒平行處理</text>
        <path d="M470,58 L470,78" stroke="#8a8578" stroke-width="1.6" marker-end="url(#a1)" fill="none"/>

        <!-- S2 -->
        <rect x="250" y="80" width="440" height="46" rx="7" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.5"/>
        <text x="470" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F6690">② 以突變為中心開視窗</text>
        <text x="470" y="117" text-anchor="middle" font-size="10" fill="#2F6690">左右各展開 window bp，實際長度 = 2×window+1</text>
        <text x="706" y="106" font-size="9.5" fill="#B06A16">canonical run 用 ±5000（不是預設的 ±1000）</text>
        <path d="M470,126 L470,146" stroke="#8a8578" stroke-width="1.6" marker-end="url(#a1)" fill="none"/>

        <!-- S3 -->
        <rect x="250" y="148" width="440" height="56" rx="7" fill="#ECE6F6" stroke="#5B3FA0" stroke-width="1.5"/>
        <text x="470" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B3FA0">③ 抓 read（腫瘤與正常抓法不同）</text>
        <text x="470" y="184" text-anchor="middle" font-size="10" fill="#3f2c70">腫瘤：只在突變那一個點抓（不跨過就沒用）</text>
        <text x="470" y="198" text-anchor="middle" font-size="10" fill="#3f2c70">正常：抓整個視窗（它提供的是甲基化基準線）</text>
        <path d="M470,204 L470,224" stroke="#8a8578" stroke-width="1.6" marker-end="url(#a1)" fill="none"/>

        <!-- S4 -->
        <rect x="250" y="226" width="440" height="66" rx="7" fill="#ECE6F6" stroke="#5B3FA0" stroke-width="1.5"/>
        <text x="470" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B3FA0">④ 過濾 + 讀單倍型 + 判定突變型/正常型</text>
        <text x="470" y="262" text-anchor="middle" font-size="10" fill="#3f2c70">淘汰：次要比對 / 補充比對 / 重複 / 未比對 / MAPQ&lt;20 / 長度&lt;1000bp</text>
        <text x="470" y="276" text-anchor="middle" font-size="10" fill="#3f2c70">走訪 CIGAR 找出突變位置對應的鹼基，比對是 ALT 還是 REF</text>
        <text x="470" y="288" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9A3B3B">強制要求 MM+ML 甲基化標記，無標記直接淘汰（無 CLI 開關）</text>
        <rect x="706" y="230" width="248" height="58" rx="6" fill="#fff" stroke="#5B3FA0" stroke-width="1"/>
        <text x="716" y="246" font-size="9.5" font-weight="700" fill="#5B3FA0">HP 標籤實測值域（6 種）</text>
        <text x="716" y="260" font-family="ui-monospace,monospace" font-size="9" fill="#3f2c70">1:7864  2:6453  1-1:3856</text>
        <text x="716" y="273" font-family="ui-monospace,monospace" font-size="9" fill="#3f2c70">2-1:3161  0:1658  3:374</text>
        <text x="716" y="284" font-size="8.5" fill="#9A3B3B">1-1／2-1 = somatic-supporting haplotag/read family</text>
        <path d="M470,292 L470,312" stroke="#8a8578" stroke-width="1.6" marker-end="url(#a1)" fill="none"/>

        <!-- S5 -->
        <rect x="250" y="314" width="440" height="66" rx="7" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.5"/>
        <text x="470" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F7D5B">⑤ 解析甲基化 → read × CpG 矩陣</text>
        <text x="470" y="350" text-anchor="middle" font-size="10" fill="#1f4f3a">MM 標記說「第幾個 C 有修飾」，ML 說「機率多高」（0–255 → 0–1）</text>
        <text x="470" y="364" text-anchor="middle" font-size="10" fill="#1f4f3a">只取 5mC；反股 read 需反向掃描；並用參考序列驗證確實是 CpG</text>
        <text x="470" y="376" text-anchor="middle" font-size="9.5" fill="#5C5A54">欄位 = 所有 read 提到的 CpG 聯集（不是交集），沒觀測到填 -1</text>
        <path d="M470,380 L470,400" stroke="#8a8578" stroke-width="1.6" marker-end="url(#a1)" fill="none"/>

        <!-- S6 -->
        <rect x="250" y="402" width="440" height="58" rx="7" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.5"/>
        <text x="470" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F7D5B">⑥ 二值化（注意是三分不是二分）</text>
        <text x="470" y="438" text-anchor="middle" font-size="10" fill="#1f4f3a">機率 ≥ 0.8 判為甲基化(1)；≤ 0.2 判為未甲基化(0)</text>
        <text x="470" y="453" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3B3B">夾在 0.2～0.8 中間的曖昧值直接丟棄，與「沒觀測」共用 -1 編碼</text>
        <path d="M470,460 L470,480" stroke="#8a8578" stroke-width="1.6" marker-end="url(#a1)" fill="none"/>

        <!-- S7 -->
        <rect x="250" y="482" width="440" height="66" rx="7" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.5"/>
        <text x="470" y="502" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B06A16">⑦ read × read 距離矩陣</text>
        <text x="470" y="518" text-anchor="middle" font-size="10" fill="#6b4310">只用兩條 read 都有觀測的 CpG；共同覆蓋 &lt; 3 個就判為無效對</text>
        <text x="470" y="532" text-anchor="middle" font-size="10" fill="#6b4310">6 種距離可選：NHD（預設）· L1 · L2 · CORR · JACCARD · BERNOULLI</text>
        <text x="470" y="544" text-anchor="middle" font-size="9.5" fill="#5C5A54">建樹前會先剔除含缺失值的 read（否則階層分群會當掉）</text>
        <path d="M470,548 L470,568" stroke="#8a8578" stroke-width="1.6" marker-end="url(#a1)" fill="none"/>

        <!-- S8 -->
        <rect x="250" y="570" width="440" height="66" rx="7" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.5"/>
        <text x="470" y="590" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B06A16">⑧ read-level methylation dendrogram → 群數 → 統計</text>
        <text x="470" y="606" text-anchor="middle" font-size="10" fill="#6b4310">階層分群（預設 UPGMA）；非 cellular phylogeny；輪廓係數掃 k=2..6</text>
        <text x="470" y="620" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3B3B">群數最少是 2 — 它不回答「到底有沒有結構」</text>
        <text x="470" y="632" text-anchor="middle" font-size="9.5" fill="#5C5A54">有沒有結構要看 PERMANOVA 與 gating，不是看 k</text>

        <!-- 右側：四檢定 -->
        <rect x="706" y="482" width="248" height="154" rx="6" fill="#fff" stroke="#B06A16" stroke-width="1.1"/>
        <text x="716" y="500" font-size="10" font-weight="700" fill="#B06A16">四類檢定各問不同問題</text>
        <text x="716" y="518" font-size="9.5" font-weight="700" fill="#6b4310">Global</text>
        <text x="716" y="531" font-size="9" fill="#5C5A54">分群結果與生物標籤有關聯嗎</text>
        <text x="716" y="549" font-size="9.5" font-weight="700" fill="#6b4310">Local</text>
        <text x="716" y="562" font-size="9" fill="#5C5A54">哪一群特別富集某個標籤</text>
        <text x="716" y="580" font-size="9.5" font-weight="700" fill="#6b4310">Structure</text>
        <text x="716" y="593" font-size="9" fill="#5C5A54">標籤關聯 centroid separation 是否與 null 不相容</text>
        <text x="716" y="611" font-size="9.5" font-weight="700" fill="#6b4310">Label</text>
        <text x="716" y="624" font-size="9" fill="#5C5A54">直接拿已知標籤切，避開先分群</text>
        <text x="716" y="634" font-size="9" fill="#5C5A54">再檢定的循環論證</text>

        <!-- 左側註記 -->
        <rect x="12" y="226" width="228" height="66" rx="6" fill="#F3E2E2" stroke="#9A3B3B" stroke-width="1.1"/>
        <text x="22" y="244" font-size="9.5" font-weight="700" fill="#9A3B3B">為什麼腫瘤只在點上抓 read</text>
        <text x="22" y="259" font-size="9" fill="#7a3030">不跨過突變的 read 無法定型 ALT/REF，</text>
        <text x="22" y="272" font-size="9" fill="#7a3030">下游本來就會濾掉。±5000 視窗下</text>
        <text x="22" y="285" font-size="9" fill="#7a3030">約 40% 會是「未覆蓋突變」。</text>

        <rect x="12" y="482" width="228" height="66" rx="6" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.1"/>
        <text x="22" y="500" font-size="9.5" font-weight="700" fill="#2F6690">建樹前為何要剔除缺失值</text>
        <text x="22" y="515" font-size="9" fill="#2F6690">缺失值永遠不會被選成最小距離，</text>
        <text x="22" y="528" font-size="9" fill="#2F6690">會產生退化的樹並在走訪時堆疊</text>
        <text x="22" y="541" font-size="9" fill="#2F6690">溢位當掉（2026-06 修）。</text>
      </g>
    </svg>
