<?xml version="1.0" encoding="UTF-8"?>
<!-- 全 7 樣本 funnel：469,849 個突變如何流失到 63,506 個單一拓撲
     來源: docs/explain/11_system-map-overview.standalone.html (svg #3)
     由 tools/extract_svg_for_github.py 產生，勿手改；改上游解釋頁後重跑。 -->
<svg viewBox="0 0 940 560" role="img" aria-labelledby="f3t f3d" xmlns="http://www.w3.org/2000/svg">
      <title id="f3t">七樣本 funnel 分流圖</title>
      <desc id="f3d">從 469,849 筆 sSNV 資料列開始，經連鎖成分建構得到 255,752 個成分，其中 66.5% 為單點無法建樹；
      k 大於等於 2 者經有界切分成為 98,955 個分析單元，扣掉無突變者剩 85,941 個帶突變單元；
      其中 12.47% 因搜尋資源上限而放棄，75,224 個完成候選家族枚舉；再扣除分母為零與遞迴篩選者，
      71,955 個可排序；最終 39,648 個有唯一最佳樹、23,858 個形狀相同、8,449 個拓撲未解。</desc>
  <rect x="0" y="0" width="940" height="560" fill="#FAF9F5"/>
      <g font-family="system-ui,-apple-system,'Noto Sans CJK TC',sans-serif" fill="#1c1b19">
        <defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"/></marker>
          <marker id="ar3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#B06A16"/></marker></defs>

        <!-- L1 -->
        <rect x="250" y="14" width="440" height="40" rx="6" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.5"/>
        <text x="470" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F6690">sSNV 資料列（7 樣本 · chr1–22）</text>
        <text x="470" y="48" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#2F6690">469,849</text>
        <path d="M470,56 L470,76" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>

        <!-- L2 -->
        <rect x="250" y="78" width="440" height="40" rx="6" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.5"/>
        <text x="470" y="96" text-anchor="middle" font-size="12" fill="#2F6690">嚴格 read-linked 連通成分</text>
        <text x="470" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#2F6690">255,752</text>
        <path d="M470,120 L470,140" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>
        <!-- 流失 1 -->
        <path d="M690,98 L760,98" stroke="#B06A16" stroke-width="1.6" marker-end="url(#ar3r)" fill="none"/>
        <rect x="766" y="80" width="166" height="38" rx="6" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.2"/>
        <text x="849" y="96" text-anchor="middle" font-size="10" fill="#6b4310">k=1 單點，無共現可用</text>
        <text x="849" y="111" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#B06A16">170,131（66.52%）</text>

        <!-- L3 -->
        <rect x="250" y="142" width="440" height="40" rx="6" fill="#ECE6F6" stroke="#5B3FA0" stroke-width="1.5"/>
        <text x="470" y="160" text-anchor="middle" font-size="12" fill="#5B3FA0">k≥2 有共現 → 有界切分後的分析單元</text>
        <text x="470" y="176" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#5B3FA0">85,621 → 98,955</text>
        <path d="M470,184 L470,204" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>
        <text x="700" y="166" font-size="9.5" fill="#5C5A54">k&gt;12 的大成分被切開，</text>
        <text x="700" y="179" font-size="9.5" fill="#5C5A54">所以單元數會變多</text>

        <!-- L4 -->
        <rect x="250" y="206" width="440" height="40" rx="6" fill="#ECE6F6" stroke="#5B3FA0" stroke-width="1.5"/>
        <text x="470" y="224" text-anchor="middle" font-size="12" fill="#5B3FA0">帶突變的單元</text>
        <text x="470" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#5B3FA0">85,941（86.85%）</text>
        <path d="M470,248 L470,268" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>
        <path d="M690,226 L760,226" stroke="#B06A16" stroke-width="1.6" marker-end="url(#ar3r)" fill="none"/>
        <rect x="766" y="208" width="166" height="38" rx="6" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.2"/>
        <text x="849" y="224" text-anchor="middle" font-size="10" fill="#6b4310">無活躍 ALT，不推論</text>
        <text x="849" y="239" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#B06A16">13,014（13.15%）</text>

        <!-- L5 -->
        <rect x="250" y="270" width="440" height="40" rx="6" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.5"/>
        <text x="470" y="288" text-anchor="middle" font-size="12" fill="#2F7D5B">候選樹家族 <tspan font-weight="700">完整枚舉完成</tspan></text>
        <text x="470" y="304" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#2F7D5B">75,224（87.53%）</text>
        <path d="M470,312 L470,332" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>
        <path d="M690,290 L760,290" stroke="#9A3B3B" stroke-width="1.8" marker-end="url(#ar3r)" fill="none"/>
        <rect x="766" y="270" width="166" height="42" rx="6" fill="#F3E2E2" stroke="#9A3B3B" stroke-width="1.5"/>
        <text x="849" y="286" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3B3B">算力上限，主動放棄</text>
        <text x="849" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#9A3B3B">10,717（12.47%）</text>
        <text x="849" y="311" text-anchor="middle" font-size="8.5" fill="#7a3030">非隨機缺失，集中在複雜區</text>

        <!-- L6 -->
        <rect x="250" y="334" width="440" height="40" rx="6" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.5"/>
        <text x="470" y="352" text-anchor="middle" font-size="12" fill="#2F7D5B">可用 read-AF 排序</text>
        <text x="470" y="368" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#2F7D5B">71,955（95.65%）</text>
        <path d="M690,354 L760,354" stroke="#B06A16" stroke-width="1.6" marker-end="url(#ar3r)" fill="none"/>
        <rect x="766" y="336" width="166" height="38" rx="6" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.2"/>
        <text x="849" y="352" text-anchor="middle" font-size="9.5" fill="#6b4310">分母為 0 / 遞迴篩選</text>
        <text x="849" y="367" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#B06A16">3,224 + 45</text>

        <!-- 三分支 -->
        <path d="M470,376 L470,396" stroke="#8a8578" stroke-width="1.6" fill="none"/>
        <path d="M180,396 L760,396" stroke="#8a8578" stroke-width="1.6" fill="none"/>
        <path d="M180,396 L180,414" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>
        <path d="M470,396 L470,414" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>
        <path d="M760,396 L760,414" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>

        <rect x="60" y="418" width="240" height="62" rx="6" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.6"/>
        <text x="180" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#2F7D5B">唯一最佳樹</text>
        <text x="180" y="456" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#2F7D5B">39,648（55.10%）</text>
        <text x="180" y="472" text-anchor="middle" font-size="9" fill="#1f4f3a">AF 算術上唯一勝出</text>

        <rect x="350" y="418" width="240" height="62" rx="6" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.6"/>
        <text x="470" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#2F6690">並列，但樹形相同</text>
        <text x="470" y="456" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#2F6690">23,858（33.16%）</text>
        <text x="470" y="472" text-anchor="middle" font-size="9" fill="#2F6690">拓撲確定，只是標籤可換</text>

        <rect x="640" y="418" width="240" height="62" rx="6" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.6"/>
        <text x="760" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#B06A16">並列且跨不同樹形</text>
        <text x="760" y="456" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="800" fill="#B06A16">8,449（11.74%）</text>
        <text x="760" y="472" text-anchor="middle" font-size="9" fill="#6b4310">「定不出來」← 這也是答案</text>

        <!-- 合併 -->
        <path d="M180,482 L180,498 L470,498" stroke="#2F7D5B" stroke-width="1.6" fill="none"/>
        <path d="M470,482 L470,498" stroke="#2F7D5B" stroke-width="1.6" fill="none"/>
        <path d="M470,498 L470,512" stroke="#2F7D5B" stroke-width="1.6" marker-end="url(#ar3)" fill="none"/>
        <rect x="230" y="516" width="480" height="38" rx="6" fill="#fff" stroke="#2F7D5B" stroke-width="2"/>
        <text x="470" y="533" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F7D5B">單一 rooted-unlabeled 拓撲 = 39,648 + 23,858</text>
        <text x="470" y="549" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" font-weight="800" fill="#2F7D5B">63,506 / 71,955 = 88.26%</text>
      </g>
    </svg>
