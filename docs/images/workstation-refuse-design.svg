<!-- 工作站生成器的拒絕渲染設計（由構造防捏造）
     來源: docs/explain/15_python-html-layer.standalone.html (svg #1)
     由 tools/extract_svg_for_github.py 產生，勿手改；改上游解釋頁後重跑。 -->
<svg viewBox="0 0 900 300" role="img" aria-labelledby="p1t p1d" xmlns="http://www.w3.org/2000/svg">
      <title id="p1t">工作站生成器的拒絕渲染機制</title>
      <desc id="p1d">生成器讀取宣告式 spec，逐項檢查每個項目是否具備 spec 宣告的必填指標；
      若齊全則渲染出互動 HTML，若缺少任一必填指標則以退出碼 3 拒絕渲染，
      而不是填入破折號或空白，藉此讓「缺資料卻看起來有資料」在結構上不可能發生。</desc>
  <rect x="0" y="0" width="900" height="300" fill="#FAF9F5"/>
      <g font-family="system-ui,-apple-system,'Noto Sans CJK TC',sans-serif" fill="#1c1b19">
        <defs><marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"/></marker></defs>

        <rect x="20" y="60" width="180" height="70" rx="7" fill="#E2ECF3" stroke="#2F6690" stroke-width="1.5"/>
        <text x="110" y="84" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2F6690">宣告式 spec</text>
        <text x="110" y="101" text-anchor="middle" font-size="9.5" fill="#2F6690">列出每個待判讀項目</text>
        <text x="110" y="115" text-anchor="middle" font-size="9.5" fill="#2F6690">與它的必填指標清單</text>

        <path d="M204,95 L252,95" stroke="#8a8578" stroke-width="1.8" marker-end="url(#w1)" fill="none"/>

        <rect x="258" y="52" width="190" height="86" rx="7" fill="#ECE6F6" stroke="#5B3FA0" stroke-width="1.8"/>
        <text x="353" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5B3FA0">生成器逐項檢查</text>
        <text x="353" y="94" text-anchor="middle" font-size="9.5" fill="#3f2c70">每個項目是否都具備</text>
        <text x="353" y="108" text-anchor="middle" font-size="9.5" fill="#3f2c70">spec 宣告的必填指標？</text>
        <text x="353" y="126" text-anchor="middle" font-size="9" fill="#5C5A54">317 行，無外部相依</text>

        <path d="M452,80 L516,42" stroke="#2F7D5B" stroke-width="1.8" marker-end="url(#w1)" fill="none"/>
        <path d="M452,112 L516,158" stroke="#9A3B3B" stroke-width="1.8" marker-end="url(#w1)" fill="none"/>

        <rect x="522" y="14" width="356" height="64" rx="7" fill="#E4F0EA" stroke="#2F7D5B" stroke-width="1.6"/>
        <text x="540" y="36" font-size="11.5" font-weight="700" fill="#2F7D5B">齊全 → 渲染互動 HTML</text>
        <text x="540" y="53" font-size="9.5" fill="#1f4f3a">人工判讀存入瀏覽器本機儲存、可匯出 JSON/CSV</text>
        <text x="540" y="68" font-size="9.5" fill="#1f4f3a">含來源標記、修正歷程、點圖放大</text>

        <rect x="522" y="130" width="356" height="64" rx="7" fill="#F3E2E2" stroke="#9A3B3B" stroke-width="1.8"/>
        <text x="540" y="152" font-size="11.5" font-weight="700" fill="#9A3B3B">缺任一必填 → 退出碼 3，拒絕渲染</text>
        <text x="540" y="169" font-size="9.5" fill="#7a3030">不是填破折號、不是留空白 —— 是整個拒絕產出</text>
        <text x="540" y="184" font-size="9.5" font-weight="700" fill="#9A3B3B">（本輪以自建最小 spec 實測確認）</text>

        <rect x="20" y="212" width="858" height="70" rx="8" fill="#F6EBD8" stroke="#B06A16" stroke-width="1.6"/>
        <text x="40" y="234" font-size="11.5" font-weight="800" fill="#B06A16">為什麼要這樣設計</text>
        <text x="40" y="253" font-size="10.5" fill="#6b4310">如果缺資料時填一個破折號，報告看起來仍然完整，讀的人不會發現那一格其實沒有依據。</text>
        <text x="40" y="271" font-size="10.5" font-weight="700" fill="#9A3B3B">「拒絕產出」讓「看起來有資料但其實沒有」這件事在結構上不可能發生 —— 這比任何檢查清單都可靠。</text>
      </g>
    </svg>
