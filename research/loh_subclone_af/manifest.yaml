dependencies:
  git_commit: "c022918"
  python_packages: ["pandas", "numpy", "scipy", "matplotlib", "seaborn"]

reproducibility:
  python_version: "3.10"
  key_parameters:
    af_extreme_threshold: [0.0, 0.1, 0.9, 1.0]
    af_intermediate_range: [0.1, 0.4, 0.6, 0.9]
    af_near_half_range: [0.4, 0.6]
    cn1_coverage_multiple_max: 0.75
    cn2_coverage_multiple_range: [0.75, 1.25]
    min_variants_per_segment: 2
    min_sample_size_for_test: 5
    nr_bins: [[10,30], [30,50], [50,80], [80,150], [150,500]]

report:
  path: "docs/experiments/validated/2026/04/20260414_LOH_Subclone_AF_Methylation_Evidence_01.md"
  index_entry: true
  memory_entry: "project_loh_subclone_af_methylation_positive.md"
