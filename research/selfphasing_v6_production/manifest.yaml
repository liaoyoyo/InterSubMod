hypotheses:
  - id: "H1"
    statement: "V6 binary patch fixes V5 Layer 1.5 over-promote in germline-absent + LOH regions while preserving V3F conservative behavior (hp=33 for ambiguous)"
    preconditions:
      - "V3F/V5/V6 three-way ISM comparison available (HCC1395 full chr)"
      - "step1_master_three_way.tsv exists with 35,332 rows × 64 cols"
    confounds:
      - "binary commit hash drift (V5 baseline vs HEAD 938f0df)"
      - "sample-specific over-promote magnitude"
    positive_criterion: "Inner LOH NG=2 V6 region count ≈ V3F (within ±10%) AND V5/V3F ratio >1.5× in cross_het bucket"
    negative_criterion: "V6 region count > V5 (no improvement) OR V5/V3F ratio not isolated to cross_het"
    verdict: "supported"  # 2026-05-15 HCC1395: V3F=5,064, V5=8,136, V6=5,353; V5/V3F ratio 5.95× in cross_het_inv
  - id: "H2"
    statement: "V6 marker coverage > V3F/V5 with 0 critical regression (caller F1 unchanged across all 7 samples)"
    preconditions:
      - "7-sample V6 ISM completed (5/7 done; COLO829 pending)"
      - "Caller F1 vs SEQC2 truth set computed for V3F/V5/V6 (HCC1395 done: 0.7166 all three)"
    confounds:
      - "COLO829 ONT R10 has no methylation (sample-specific limitation)"
      - "caller F1 metric definition (per CL paper §4.3)"
    positive_criterion: "V6 marker coverage +5%+ over V3F, n>=5/7 samples consistent direction"
    negative_criterion: "≥1 sample marker coverage regresses OR caller F1 drops"
    verdict: "partial"  # 5/7 done (HCC1395 5/8 confirmed +9% marker; 4 samples extending)
  - id: "H3"
    statement: "V6 production tag enables Archive TO 7-sample rerun + PI Report 4-29 errata 5-item package one-shot delivery"
    preconditions:
      - "H1 supported + H2 supported"
      - "binary commit hash finalized + git tag created"
      - "manifest.yaml updated with v6 commit"
    confounds:
      - "PI ack timing (lab meeting vs written email)"
      - "errata content drift (5/9 paired audit added new errata candidate E5)"
    positive_criterion: "Git tag v6-prod-* exists + 5 errata + V6 sign-off email delivered"
    negative_criterion: "PI requests new audit before sign-off (T4.3 workload expands)"
    verdict: null

