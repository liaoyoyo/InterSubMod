    paths:
      bam_a_baseline_09: /big7_disk/liaoyoyo2001/longphase-to-mod/output/threshold_compare/baseline_09/tumor_tagged.bam
      bam_b_v5_flag: /big7_disk/liaoyoyo2001/longphase-to-mod/output/threshold_compare/v5_flag/tumor_tagged.bam
      bam_c_v5_pass1only_4_12: /big7_disk/liaoyoyo2001/longphase-to-mod/output/pononly_v5_somatic_fallback/tumor_tagged.bam
