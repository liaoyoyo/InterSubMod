    effect: "結論仍成立但低估 AF-stratified 潛力；若重算以 AF<0.4 區間，ΔAUC 預期更高"
  - target: "B.1-3 per-sample Cohen's d"
    effect: "若 with AF<0.4 重算，HCC1954/COLO829 可能從「特殊」→「POS」"
  - target: "結論穩定度補充結論 16"
    effect: "升級 ⭐3 → ⭐4"
  - target: "Phase 2 biology characterization"
    effect: "HPFineNGroups 作為 biology-level subclone marker 強化；HCC1954 樣本特異性失效有明確機制解釋"
  - target: "memory project_hpfinengroups_subclone_marker.md"
    effect: "已更新（20260418）"

