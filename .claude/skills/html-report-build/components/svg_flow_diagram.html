<!-- svg_flow_diagram.html — Inline SVG flow / causal chain
     When source .md describes: 因果鏈, 流程, 兩層 bug, 修補順序, decision tree
     Standalone mode (Rule 4): use SVG for ≤10 nodes; PNG (matplotlib) for larger.

     Accessibility: role="img" + <title> + <desc> required.
     Colors via design tokens (CSS variables in containing HTML).
-->

<!-- Example 1: 4-step causal chain (priority bug → 17.3:1) -->
<figure class="svg-figure">
  <svg viewBox="0 0 800 180" role="img"
       aria-labelledby="flow1-title flow1-desc"
       xmlns="http://www.w3.org/2000/svg">

    <desc id="flow1-desc">somatic 1 票 → break early → germline 5 票被忽略 → 17.3:1 偏移</desc>

    <!-- 4 boxes -->
    <g font-family="var(--ff-body, system-ui)" font-size="14">

      <rect x="20"  y="60" width="150" height="60" rx="8"
            fill="#FEF2F0" stroke="#C2410C" stroke-width="1.5"/>
      <text x="95" y="86" text-anchor="middle" font-weight="600" fill="#7F1D1D">somatic 1 票</text>
      <text x="95" y="106" text-anchor="middle" fill="#7F1D1D" font-size="11">vector 順序 ❶</text>

      <rect x="220" y="60" width="150" height="60" rx="8"
            fill="#FEF2F0" stroke="#C2410C" stroke-width="1.5"/>
      <text x="295" y="86" text-anchor="middle" font-weight="600" fill="#7F1D1D">break early</text>
      <text x="295" y="106" text-anchor="middle" fill="#7F1D1D" font-size="11">迴圈跳出</text>

      <rect x="420" y="60" width="150" height="60" rx="8"
            fill="#FEF7E6" stroke="#A16207" stroke-width="1.5"/>
      <text x="495" y="86" text-anchor="middle" font-weight="600" fill="#78350F">germline 5 票忽略</text>
      <text x="495" y="106" text-anchor="middle" fill="#78350F" font-size="11">未到 ❷❸</text>

      <rect x="620" y="60" width="160" height="60" rx="8"
            fill="#FEE2E2" stroke="#7F1D1D" stroke-width="2"/>
      <text x="700" y="86" text-anchor="middle" font-weight="700" fill="#7F1D1D">17.3:1 偏移</text>
      <text x="700" y="106" text-anchor="middle" fill="#7F1D1D" font-size="11">tag layer 形成</text>

      <!-- Arrows -->
      <defs>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"

        </marker>
      </defs>
      <line x1="170" y1="90" x2="215" y2="90" stroke="#7F1D1D"
            stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <line x1="370" y1="90" x2="415" y2="90" stroke="#7F1D1D"
            stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <line x1="570" y1="90" x2="615" y2="90" stroke="#7F1D1D"
            stroke-width="1.5" marker-end="url(#arrow-red)"/>

      <!-- Header label -->
      <text x="400" y="30" text-anchor="middle" font-size="13"
            fill="#6B6B66" font-weight="600">baseline `getVote()` line 533</text>
    </g>
  </svg>
  <figcaption>圖 1：Priority bug 4 步因果鏈 — 1 票 somatic 觸發整個 17.3:1 偏移</figcaption>
</figure>

<!-- Example 2: Two-layer fix correspondence -->
<figure class="svg-figure">
  <svg viewBox="0 0 700 240" role="img"
       aria-labelledby="flow2-title flow2-desc"
       xmlns="http://www.w3.org/2000/svg">
    <title id="flow2-title">兩層 bug 兩層修補對應</title>
    <desc id="flow2-desc">phasing 層 PON-only flag 修球員兼裁判；tagging 層 V3F two-layer 修 priority bug</desc>

    <g font-family="var(--ff-body, system-ui)" font-size="13">

      <!-- Layer 1: phasing -->
      <rect x="20"  y="20" width="280" height="80" rx="8"
            fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/>
      <text x="160" y="46" text-anchor="middle" font-weight="700" fill="#1E3A8A">Layer 1: phasing</text>
      <text x="160" y="66" text-anchor="middle" fill="#1E3A8A" font-size="11">球員兼裁判 (somatic 進 graph)</text>
      <text x="160" y="85" text-anchor="middle" fill="#1E3A8A" font-size="11">→ edge weight 暴漲 → 自我增強</text>

      <rect x="400" y="20" width="280" height="80" rx="8"
            fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
      <text x="540" y="46" text-anchor="middle" font-weight="700" fill="#15803D">修補：PON-only flag</text>
      <text x="540" y="66" text-anchor="middle" fill="#15803D" font-size="11" font-family="var(--ff-mono, monospace)">8b8c1fd</text>
      <text x="540" y="85" text-anchor="middle" fill="#15803D" font-size="11">PoN 外位點不進 phasing graph</text>

      <!-- Layer 2: tagging -->
      <rect x="20"  y="130" width="280" height="80" rx="8"
            fill="#FEF7E6" stroke="#A16207" stroke-width="1.5"/>
      <text x="160" y="156" text-anchor="middle" font-weight="700" fill="#78350F">Layer 2: tagging</text>
      <text x="160" y="176" text-anchor="middle" fill="#78350F" font-size="11">getVote priority bug</text>
      <text x="160" y="195" text-anchor="middle" fill="#78350F" font-size="11">→ 1 票蓋 5 票 break early</text>

      <rect x="400" y="130" width="280" height="80" rx="8"
            fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
      <text x="540" y="156" text-anchor="middle" font-weight="700" fill="#15803D">修補：V3F two-layer</text>
      <text x="540" y="176" text-anchor="middle" fill="#15803D" font-size="11" font-family="var(--ff-mono, monospace)">41ff147 + 380e8d2</text>
      <text x="540" y="195" text-anchor="middle" fill="#15803D" font-size="11">germline 5 票主導 + INDEL guard</text>

      <!-- Arrows -->
      <defs>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
        </marker>
      </defs>
      <line x1="300" y1="60"  x2="395" y2="60"  stroke="#15803D"
            stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <line x1="300" y1="170" x2="395" y2="170" stroke="#15803D"
            stroke-width="1.5" marker-end="url(#arrow-green)"/>
    </g>
  </svg>
  <figcaption>圖 2：兩層 bug 對應兩層修補 — 缺一不可</figcaption>
</figure>

<!--
USAGE NOTES (for LLM):

1. viewBox proportion: keep <2:1 ratio (e.g. 800x180, 700x240).
2. font-family inherits via `var(--ff-body)` from containing HTML CSS.
3. Use solid fills + 1.5-2px strokes; no gradients (taboo).
4. Arrow markers defined inline (one per color).
5. Nested <g> for grouping by section.
6. role="img" + <title> + <desc> mandatory for accessibility.
7. Max 10 nodes per flow diagram; if more → use multiple SVGs or PNG.

ANTI-PATTERNS (do NOT do):
- ❌ <filter><feGaussianBlur>...</filter>  (dated drop-shadow)
- ❌ fill="url(#myGradient)"  (gradient taboo)
- ❌ <animate>  (animation)
- ❌ embedded base64 PNG  (defeats SVG purpose)
- ❌ inline style="..."  (use class + global CSS)
-->
