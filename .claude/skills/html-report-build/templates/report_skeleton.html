<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{REPORT_TITLE}}</title>
  <style>
    /* ── Design tokens (copy from templates/design_tokens.css) ──── */
    :root {
      --c-accent: #D97757; --c-accent-deep: #B85A3F;
      --c-text: #141413; --c-text-soft: #6B6B66;
      --c-bg: #FAF9F5; --c-surface: #FFFFFF; --c-border: #E3DACC;
      --c-code-bg: #F4EFE6;
      --c-critical: #C2410C; --c-warning: #A16207; --c-success: #15803D;

      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

      --ff-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK TC",
                 "Source Han Sans TW", "Droid Sans Fallback", system-ui, sans-serif;
      --ff-mono: "JetBrains Mono", "DejaVu Sans Mono", Menlo, Monaco, monospace;

      --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 18px;
      --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 36px;
      --lh-tight: 1.25; --lh-base: 1.6;
      --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
      --shadow-sm: 0 1px 2px rgba(20,20,19,0.05);
      --shadow-md: 0 2px 8px rgba(20,20,19,0.08);
      --w-prose: 70ch;
    }

    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--c-bg); color: var(--c-text);
           font-family: var(--ff-body); font-size: var(--fs-md); line-height: var(--lh-base); }

    /* ── Prose article ── */
    .prose { max-width: var(--w-prose); margin: 0 auto;
             padding: var(--sp-7) var(--sp-4); background: var(--c-surface);
             border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
             margin-top: var(--sp-5); margin-bottom: var(--sp-5); }
    .prose h1 { font-size: var(--fs-3xl); margin: 0 0 var(--sp-5); color: var(--c-text);
                border-bottom: 2px solid var(--c-accent); padding-bottom: var(--sp-3); }
    .prose h2 { font-size: var(--fs-2xl); margin: var(--sp-7) 0 var(--sp-3); color: var(--c-text);
                border-bottom: 1px solid var(--c-border); padding-bottom: var(--sp-2); }
    .prose h3 { font-size: var(--fs-xl); margin: var(--sp-5) 0 var(--sp-2); color: var(--c-text); }
    .prose h4 { font-size: var(--fs-lg); margin: var(--sp-4) 0 var(--sp-2); color: var(--c-text-soft); }
    .prose p, .prose ul, .prose ol { margin: var(--sp-3) 0; }
    .prose ul, .prose ol { padding-left: var(--sp-5); }
    .prose li { margin: var(--sp-1) 0; }
    .prose code { background: var(--c-code-bg); padding: 1px 6px; border-radius: var(--radius-sm);
                  font-family: var(--ff-mono); font-size: 0.92em; }
    .prose pre { background: var(--c-code-bg); padding: var(--sp-3); border-radius: var(--radius-md);
                 overflow-x: auto; font-family: var(--ff-mono); font-size: var(--fs-sm); }
    .prose pre code { background: none; padding: 0; }
    .prose a { color: var(--c-accent); text-decoration: underline; text-underline-offset: 2px; }
    .prose a:hover { color: var(--c-accent-deep); }
    .prose blockquote { border-left: 3px solid var(--c-accent); padding-left: var(--sp-4);
                        color: var(--c-text-soft); margin: var(--sp-3) 0; font-style: italic; }
    .prose table { border-collapse: collapse; width: 100%; margin: var(--sp-4) 0; font-size: var(--fs-sm); }
    .prose th, .prose td { border: 1px solid var(--c-border); padding: var(--sp-2) var(--sp-3); text-align: left; }
    .prose th { background: var(--c-code-bg); font-weight: 600; }
    .prose figure { margin: var(--sp-4) 0; text-align: center; }
    .prose figure img { max-width: 100%; height: auto; border-radius: var(--radius-md); }
    .prose figcaption { font-size: var(--fs-sm); color: var(--c-text-soft); margin-top: var(--sp-2); }
    .prose details { margin: var(--sp-3) 0; padding: var(--sp-2) var(--sp-3);
                     background: var(--c-surface); border: 1px solid var(--c-border);
                     border-radius: var(--radius-md); }
    .prose details summary { cursor: pointer; font-weight: 600; color: var(--c-accent-deep); }
    .prose details[open] summary { margin-bottom: var(--sp-2); }
    .prose hr { border: 0; border-top: 1px solid var(--c-border); margin: var(--sp-6) 0; }

    /* ── Callouts ── */
    .callout-critical { background: #FEF2F0; border-left: 4px solid var(--c-critical);
                        padding: var(--sp-3) var(--sp-4); margin: var(--sp-4) 0;
                        border-radius: var(--radius-md); color: #7F1D1D; }
    .callout-warning { background: #FEF7E6; border-left: 4px solid var(--c-warning);
                       padding: var(--sp-3) var(--sp-4); margin: var(--sp-4) 0;
                       border-radius: var(--radius-md); color: #78350F; }
    .callout-success { background: #F0FDF4; border-left: 4px solid var(--c-success);
                       padding: var(--sp-3) var(--sp-4); margin: var(--sp-4) 0;
                       border-radius: var(--radius-md); color: #166534; }

    /* ── Stat boxes (D17 visual unit) ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                 gap: var(--sp-3); margin: var(--sp-4) 0; }
    .stat-box { background: var(--c-surface); border: 1px solid var(--c-border);
                border-radius: var(--radius-md); padding: var(--sp-3); text-align: center; }
    .stat-box .number { font-size: var(--fs-2xl); font-weight: 700; color: var(--c-accent); }
    .stat-box .label { font-size: var(--fs-sm); color: var(--c-text-soft); margin-top: var(--sp-1); }

    /* ── Print ── */
    @media print {
      body { background: white; }
      .prose { box-shadow: none; max-width: 100%; padding: 0; }
      details { open: true; }
      details summary { list-style: none; }
      a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.85em; color: var(--c-text-soft); }
      .no-print, .toc-nav { display: none !important; }
      pre, table, blockquote, figure { page-break-inside: avoid; }
      h1, h2, h3 { page-break-after: avoid; }
    }
  </style>
</head>
<body>

<article class="prose">
