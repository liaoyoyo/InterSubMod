<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DECK_TITLE}} — Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0;
           font-family: "Noto Sans CJK TC", "Source Han Sans TW", "Droid Sans Fallback",
                        -apple-system, system-ui, sans-serif;
           background: #F5F5F7; color: #1F2937; line-height: 1.5; }

    /* ── Sticky top bar ── */
    header.topbar {
      position: sticky; top: 0; z-index: 100;
      background: #1E3A8A; color: white;
      padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header.topbar h1 { color: white; font-size: 18px; margin: 0; font-weight: 600; }
    header.topbar .meta { font-size: 13px; opacity: 0.85; }
    header.topbar code { font-family: "JetBrains Mono", monospace; font-size: 0.9em; }

    /* ── Sticky tab nav ── */
    nav.slidetabs {
      position: sticky; top: 60px; z-index: 99;
      background: #FFFFFF; padding: 8px 16px;
      border-bottom: 1px solid #E5E7EB;
      display: flex; gap: 6px; overflow-x: auto; flex-wrap: wrap;
    }
    nav.slidetabs button {
      background: #F3F4F6; border: 1px solid #D1D5DB; color: #374151;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 500; white-space: nowrap;
      transition: all 0.15s;
    }
    nav.slidetabs button:hover { background: #E5E7EB; border-color: #9CA3AF; }
    nav.slidetabs button.active { background: #1E3A8A; color: white; border-color: #1E3A8A; }
    nav.slidetabs .nav-backup { background: #F3E8FF; color: #6D28D9; font-style: italic; }

    /* ── Section labels (badge color per section) ── */
    nav.slidetabs button[data-section="S0"] { border-left: 3px solid #7C3AED; }
    nav.slidetabs button[data-section="S1"] { border-left: 3px solid #DC2626; }
    nav.slidetabs button[data-section="S2"] { border-left: 3px solid #EA580C; }
    nav.slidetabs button[data-section="S3"] { border-left: 3px solid #CA8A04; }
    nav.slidetabs button[data-section="S4"] { border-left: 3px solid #1E3A8A; }
    nav.slidetabs button[data-section="S5"] { border-left: 3px solid #15803D; }
    nav.slidetabs button[data-section="S6"] { border-left: 3px solid #0E7490; }
    nav.slidetabs button[data-section="S7"] { border-left: 3px solid #B45309; }
    nav.slidetabs button[data-section="Q&A"] { border-left: 3px solid #6B7280; }

    /* ── iframe slide preview ── */
    main.iframe-wrap { max-width: 1280px; margin: 16px auto; padding: 0 16px; }
    main.iframe-wrap iframe {
      width: 100%; height: calc(100vh - 200px); min-height: 720px;
      border: 1px solid #D1D5DB; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); background: white;
    }

    /* ── Keyboard hint ── */
    .kbd-hint {
      position: fixed; bottom: 12px; left: 12px;
      background: rgba(0,0,0,0.7); color: white;
      padding: 6px 12px; border-radius: 4px;
      font-size: 11px; pointer-events: none;
    }
    .kbd-hint kbd {
      background: white; color: #1F2937;
      padding: 1px 6px; border-radius: 3px;
      font-size: 10px; margin: 0 2px;
    }

    /* ── Print ── */
    @media print {
      header.topbar, nav.slidetabs, .kbd-hint { display: none; }
      main.iframe-wrap iframe { height: 720px; }
    }
  </style>
</head>
<body>

<header class="topbar" role="banner">
  <h1>📊 {{DECK_TITLE}}</h1>
  <div class="meta">
    <code>{{REPO_PATH}}</code>
    &nbsp;|&nbsp; Build: {{BUILD_DATE}}
  </div>
</header>

<nav class="slidetabs" id="tabs" role="navigation" aria-label="Slide selector">
  <!--
    LLM: Insert one <button> per slide, e.g.:
    <button data-slide="01_cover" data-section="S0" class="active">01 S0 Cov</button>
    <button data-slide="02_tldr" data-section="S0">02 S0 Flow</button>
    <button data-slide="03_observation" data-section="S1">03 S1 Obs</button>
    ...
    <button data-slide="b1_backup" data-section="Q&A" class="nav-backup">B1 Q&A</button>

    Button label format: "{NN} {Section} {Short label}" — max 14 chars.
    First button gets class="active". Backup slides get class="nav-backup".
  -->
  {{SLIDE_TAB_BUTTONS}}
</nav>

<main class="iframe-wrap" role="main">
  <iframe id="slide-frame" src="{{FIRST_SLIDE_FILENAME}}" title="Active slide preview"></iframe>
</main>

<div class="kbd-hint">點 nav 切換 slide; 子頁亦可雙擊獨立開啟</div>

<script>
  // Tab click → swap iframe.src + toggle active
  document.querySelectorAll('nav.slidetabs button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.dataset.slide;
      document.getElementById('slide-frame').src = 'slide_' + id + '.html';
      document.querySelectorAll('nav.slidetabs button').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
    });
  });

  // Keyboard nav: ← / → between slides
  document.addEventListener('keydown', function(e) {
    const buttons = Array.from(document.querySelectorAll('nav.slidetabs button'));
    const active = buttons.findIndex(b => b.classList.contains('active'));
    if (e.key === 'ArrowRight' && active < buttons.length - 1) buttons[active + 1].click();
    if (e.key === 'ArrowLeft' && active > 0) buttons[active - 1].click();
  });
</script>

</body>
</html>
