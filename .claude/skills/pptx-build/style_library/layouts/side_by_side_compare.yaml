# Layout: side_by_side_compare
# Source: playbook §15 (Comparison Report common page)

name: side-by-side-compare
template_type: [comparison]
purpose: |
  雙欄並列比較（與 before_after_split 區別：
  side_by_side 強調「兩種方法 / 兩個對象」對照，
  before_after 強調「同一對象修改前後」）。

canvas:
  width_in: 13.33
  height_in: 7.5
  aspect_ratio: "16:9"

zones:
  title_bar:
    x_in: 0.5
    y_in: 0.4
    width_in: 12.3
    height_in: 0.8
    sub_objects:
      - thesis_title_bar

  left_panel:
    label: "Method A / Sample A"
    x_in: 0.5
    y_in: 1.4
    width_in: 5.8
    height_in: 4.3
    sub_objects:
      - panel_title (16pt bold)
      - main_visual or method_blue_box
      - 1-3 supporting_metric
    notes: "色調中性（灰 / 藍）"

  right_panel:
    label: "Method B / Sample B"
    x_in: 7.0
    y_in: 1.4
    width_in: 5.8
    height_in: 4.3
    sub_objects:
      - panel_title (16pt bold)
      - main_visual or method_blue_box
      - 1-3 supporting_metric
    notes: "色調中性，與左欄區分"

  comparison_table:
    x_in: 0.5
    y_in: 5.9
    width_in: 12.3
    height_in: 1.0
    sub_objects:
      - 3-column table: [Metric | A | B | Δ]
    notes: "至多 3 行"

  metric_delta_strip:
    x_in: 3.0
    y_in: 6.95
    width_in: 7.3
    height_in: 0.5
    sub_objects:
      - tldr_big_number (簡化版)
    notes: "主要 delta 強調"

alignment_rules:
  - 兩欄等寬等高（5.8 × 4.3 inch）
  - 兩欄主視覺垂直中心對齊
  - 比較表跨整 slide 寬度
  - delta strip 居中於兩欄之間

example_use:
  - paired vs TO 模式 F1 對照
  - HCC1395 vs COLO829 異質性對比
  - ClairS vs ClairS-TO output 比較

counter_example:
  - 同對象前後修改（用 before_after_split）
  - 三方比較（用 5card_grid）
  - 多維度交叉（用 4quadrant_matrix）

focal_point_zone:
  position: "metric delta strip (bottom)"
  x_in: 3.0
  y_in: 6.95
  width_in: 7.3
  height_in: 0.5
  description: |
    底部 delta strip 是視覺焦點。
    比較的 punchline（A vs B 結論）應在此呈現。
  rule: |
    若沒有量化 delta（純結構或定性對照），
    可隱藏 delta strip，focal point 改為比較表中央列。
