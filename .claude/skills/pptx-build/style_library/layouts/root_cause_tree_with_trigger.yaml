# Layout: root_cause_tree_with_trigger
# Source: playbook §19 (v3 S11 紅色根框 + 3 葉樹原型)

name: root-cause-tree-with-trigger
template_type: [improvement, academic_defense]
purpose: |
  根因樹 + 觸發點版型。Root 用紅色強調（觸發 / 主問題），
  分支為觸發路徑，leaf 為驗證後的根因或解決方案。
  與 decision_tree_layout 區別：focal point 在 root（問題本身）。

canvas:
  width_in: 13.33
  height_in: 7.5
  aspect_ratio: "16:9"

zones:
  title_bar:
    x_in: 0.5
    y_in: 0.4
    width_in: 12.3
    height_in: 0.8
    sub_objects:
      - thesis_title_bar
    notes: "如『Self-Phasing 17.3:1 artifact 由 4 commit 漸進修補』"

  trigger_root_box:
    x_in: 4.5
    y_in: 1.5
    width_in: 4.3
    height_in: 1.0
    sub_objects:
      - decision_tree_node (type: root, RED tone)
      - tldr_big_number (mini, e.g. "17.3:1")
    notes: "觸發點：紅色強調，含核心數字"

  branch_layer:
    type: "horizontal_array"
    x_in: 0.5
    y_in: 3.0
    width_in: 12.3
    height_in: 1.2
    branch_count: "3"
    branch_object: "decision_tree_node (type: branch, blue or grey tone)"
    notes: "3 個分支對應 3 個假設或修補步驟"

  leaf_layer:
    type: "horizontal_array"
    x_in: 0.5
    y_in: 4.5
    width_in: 12.3
    height_in: 1.5
    leaf_count: "3"
    leaf_object: "decision_tree_node (type: leaf, green or grey tone)"
    notes: "Leaf 為驗證結果（綠=確認、灰=被取代）"

  bottom_caveat_strip:
    x_in: 0.5
    y_in: 6.3
    width_in: 12.3
    height_in: 0.8
    sub_objects:
      - caveat_red_strip
    notes: "如『若不解決 → 所有下游 ISM 統計失效』"

  footer_strip:
    x_in: 9.0
    y_in: 7.1
    width_in: 4.0
    height_in: 0.3
    sub_objects:
      - citation_footnote

alignment_rules:
  - root 居中頂部（紅色，視覺權重最大）
  - 3 分支水平等距
  - 3 leaf 水平等距，與分支對齊
  - 連線從 root 底部 → 各分支頂部 → 各 leaf 頂部
  - 紅色 root 與紅色 caveat strip 上下呼應

example_use:
  - v3 S11 Self-Phasing 17.3:1 → 3 假設 → 4 commit 修補
  - Improvement report root cause analysis
  - Bug post-mortem analysis

counter_example:
  - 演算法決策樹（用 decision_tree_layout，root 為中性）
  - 線性歷程（用 timeline_horizontal）
  - 並列功能（用 5card_grid）

focal_point_zone:
  position: "trigger root box (top center, red emphasis)"
  x_in: 4.5
  y_in: 1.5
  width_in: 4.3
  height_in: 1.0
  description: |
    Root box 是 focal point。紅色強調 + 核心數字（如 17.3:1）
    立即吸引第一眼注意。聽眾從 root 往下展開讀取分支與 leaf。
    bottom caveat 與 root 形成「問題本身 + 風險警示」的紅色語氣呼應。
  rule: |
    若 focal point 在 leaf（解決方案而非問題），
    應改用 decision_tree_layout（root 中性、leaf 強調）。
