<svg viewBox="0 0 760 442" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Haplotagging：germline 先分 HP1/HP2，somatic 再細分子標 HP1-1/HP2-1"><title>Haplotagging：germline 先分 HP1/HP2，somatic 再細分子標 HP1-1/HP2-1</title><desc>示意 · read=五邊形箭頭、鹼基=ATGC、變異格=分類上色（藍 germline / 橘 somatic / 灰 seq-error）</desc><rect width="760" height="442" fill="#FAF9F5"/>
<text x="10" y="26" font-size="16" font-weight="800" fill="#141413">Haplotagging：germline 先分 HP1/HP2，somatic 再細分子標 HP1-1/HP2-1</text>
<text x="10" y="46" font-size="11.5" fill="#6B6B66">示意 · read=五邊形箭頭、鹼基=ATGC、變異格=分類上色（藍 germline / 橘 somatic / 灰 seq-error）</text>
<text x="10" y="125" font-size="10" font-weight="700" fill="#6B6B66">圖例</text>
<circle cx="56" cy="121" r="5.5" fill="#2F5597"/><text x="67" y="125" font-size="10.5" fill="#141413">Germline (HP1)</text>
<circle cx="224" cy="121" r="5.5" fill="#8FAADC"/><text x="235" y="125" font-size="10.5" fill="#141413">Germline (HP2)</text>
<circle cx="392" cy="121" r="5.5" fill="#C55A11"/><text x="403" y="125" font-size="10.5" fill="#141413">Somatic</text>
<circle cx="560" cy="121" r="5.5" fill="#7F7F7F"/><text x="571" y="125" font-size="10.5" fill="#141413">Seq error</text>
<line x1="10" y1="136" x2="750" y2="136" stroke="#eee"/>
<text x="138" y="174" font-size="10" font-weight="700" fill="#6B6B66" text-anchor="end">Germline</text>
<text x="138" y="190" font-size="10.5" font-weight="800" fill="#2F5597" text-anchor="end">HP1</text>
<text x="138" y="201" font-size="8" fill="#6B6B66" text-anchor="end">母本 Maternal</text>
<polygon points="158,176 346,176 356,184 346,192 158,192" fill="#2F5597" opacity=".14"/>
<circle cx="252" cy="184" r="5.5" fill="#2F5597"/>
<polygon points="158,200 346,200 356,208 346,216 158,216" fill="#2F5597" opacity=".14"/>
<circle cx="252" cy="208" r="5.5" fill="#2F5597"/>
<text x="138" y="246" font-size="10.5" font-weight="800" fill="#8FAADC" text-anchor="end">HP2</text>
<text x="138" y="257" font-size="8" fill="#6B6B66" text-anchor="end">父本 Paternal</text>
<polygon points="158,232 346,232 356,240 346,248 158,248" fill="#8FAADC" opacity=".14"/>
<circle cx="212" cy="240" r="5.5" fill="#8FAADC"/>
<polygon points="158,256 346,256 356,264 346,272 158,272" fill="#8FAADC" opacity=".14"/>
<circle cx="212" cy="264" r="5.5" fill="#8FAADC"/>
<line x1="110" y1="284" x2="360" y2="284" stroke="#E4E2DA" stroke-dasharray="4 3"/>
<text x="110" y="281" font-size="8.5" fill="#6B6B66">↓ haplotag → 依 somatic 變異細分子標</text>
<text x="138" y="302" font-size="10" font-weight="700" fill="#6B6B66" text-anchor="end">Somatic</text>
<text x="138" y="318" font-size="10.5" font-weight="800" fill="#C55A11" text-anchor="end">HP1-1</text>
<text x="138" y="329" font-size="8" fill="#6B6B66" text-anchor="end">HP1 + somatic</text>
<polygon points="158,304 346,304 356,312 346,320 158,320" fill="#C55A11" opacity=".14"/>
<circle cx="252" cy="312" r="5.5" fill="#2F5597"/>
<circle cx="292" cy="312" r="5.5" fill="#C55A11"/>
<text x="138" y="350" font-size="10.5" font-weight="800" fill="#C55A11" text-anchor="end">HP2-1</text>
<text x="138" y="361" font-size="8" fill="#6B6B66" text-anchor="end">HP2 + somatic</text>
<polygon points="158,336 346,336 356,344 346,352 158,352" fill="#C55A11" opacity=".14"/>
<circle cx="212" cy="344" r="5.5" fill="#8FAADC"/>
<circle cx="292" cy="344" r="5.5" fill="#C55A11"/>
<circle cx="332" cy="344" r="5.5" fill="#7F7F7F"/>
<line x1="10" y1="366" x2="750" y2="366" stroke="#eee"/>
<text x="10" y="388" font-size="10.5" font-weight="700" fill="#7a4">▣ label-flip：HP1-1 / HP2-1 = germline HP1 / HP2 鏈上因 somatic 變異細分的子單倍型，非獨立第三 haplotype。</text>
<text x="10" y="406" font-size="9.5" fill="#6B6B66">※ 聚合數字皆 verified 真值（0 項，附 src 可 grep）；read 甲基點為示意（synthetic）。</text>
<text x="748" y="422" font-size="8.5" fill="#ccc" text-anchor="end">schematic reads = synthetic / 示意</text>
</svg>