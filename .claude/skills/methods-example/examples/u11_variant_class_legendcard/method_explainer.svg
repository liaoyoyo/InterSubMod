<svg viewBox="0 0 760 282" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="變異類別：germline vs somatic（色彩語意錨）"><title>變異類別：germline vs somatic（色彩語意錨）</title><desc>藍=germline（遺傳）· 橘=somatic（後天）· 灰=seq-error · category-by-fill 不換形狀</desc><rect width="760" height="282" fill="#FAF9F5"/>
<text x="10" y="26" font-size="16" font-weight="800" fill="#141413">變異類別：germline vs somatic（色彩語意錨）</text>
<text x="10" y="46" font-size="11.5" fill="#6B6B66">藍=germline（遺傳）· 橘=somatic（後天）· 灰=seq-error · category-by-fill 不換形狀</text>
<rect x="150" y="114" width="580" height="104" rx="8" fill="#fff" stroke="#E4E2DA"/>
<circle cx="172" cy="134" r="7" fill="#2F5597"/>
<text x="190" y="138" font-size="11.5" font-weight="700" fill="#2F5597">Germline variant</text>
<text x="300" y="138" font-size="10.5" fill="#141413">生殖細胞、可遺傳、phasing 錨點（藍）</text>
<circle cx="172" cy="164" r="7" fill="#C55A11"/>
<text x="190" y="168" font-size="11.5" font-weight="700" fill="#C55A11">Somatic variant</text>
<text x="300" y="168" font-size="10.5" fill="#141413">體細胞、不遺傳、可致癌（橘）</text>
<circle cx="172" cy="194" r="7" fill="#7F7F7F"/>
<text x="190" y="198" font-size="11.5" font-weight="700" fill="#7F7F7F">Seq error</text>
<text x="300" y="198" font-size="10.5" fill="#141413">定序錯誤、散落雜訊（灰）</text>
<line x1="10" y1="232" x2="750" y2="232" stroke="#eee"/>
<text x="10" y="254" font-size="9.5" fill="#6B6B66">※ 聚合數字皆 verified 真值（0 項，附 src 可 grep）；read 甲基點為示意（synthetic）。</text>
</svg>