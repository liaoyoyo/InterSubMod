name: Handoff portable CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: handoff-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Clean build and portable handoff validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_DIR: /tmp/intersubmod-build-${{ github.run_id }}-${{ github.run_attempt }}
      TINY_E2E_DIR: /tmp/intersubmod-tiny-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      CI_RECEIPT_DIR: /tmp/intersubmod-ci-receipts-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install C++ and Python prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libboost-dev \
            libhts-dev \
            pkg-config \
            samtools
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --requirement requirements-ci.lock
          .venv/bin/python -m pip install --require-hashes --requirement requirements-docs-qa.lock
          .venv/bin/python -m playwright install --with-deps chromium
          printf '%s\n' "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Record the CI environment
        run: |
          set -euo pipefail
          mkdir -p "$CI_RECEIPT_DIR"
          .venv/bin/python -m pip freeze --all > "$CI_RECEIPT_DIR/pip-freeze.txt"
          {
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            uname -a
            cmake --version | head -n 1
            c++ --version | head -n 1
            pkg-config --modversion htslib
            samtools --version | head -n 2
            .venv/bin/python --version
            .venv/bin/python -m pip --version
          } > "$CI_RECEIPT_DIR/versions.txt"
          cat "$CI_RECEIPT_DIR/versions.txt"

      - name: Configure a clean Release build
        run: |
          set -euo pipefail
          cmake -E remove_directory "$BUILD_DIR"
          cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release

      - name: Build all C++ targets
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --parallel 2

      - name: Run all discovered CTest tests
        run: |
          set -euo pipefail
          ctest \
            --test-dir "$BUILD_DIR" \
            --output-on-failure \
            --no-tests=error \
            --parallel 2

      - name: Run the complete Python test suite
        run: |
          set -euo pipefail
          # This includes the portable handoff targets. test_site_profile.py
          # covers the fail-closed, zero-side-effect run_benchmark.sh --plan contract.
          .venv/bin/python -m pytest tests -q

      - name: Validate handoff JSON documents against their schemas
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import FormatChecker
          from jsonschema.validators import validator_for

          package = Path("docs/handoff/20260813_完整研究資料與軟體交接_01")
          pairs = [
              (Path("config/site-profile.example.json"), Path("config/site-profile.schema.json")),
              (package / "registries/dataset_registry.json", package / "schemas/dataset-registry.schema.json"),
              (package / "registries/run_registry.json", package / "schemas/run-registry.schema.json"),
              (package / "registries/artifact_registry.json", package / "schemas/artifact-registry.schema.json"),
              (package / "registries/machine_path_registry.json", package / "schemas/machine-path-registry.schema.json"),
              (package / "registries/storage_root_manifest.json", package / "schemas/storage-root-manifest.schema.json"),
              (package / "registries/authority_superseded_crosswalk.json", package / "schemas/authority-crosswalk.schema.json"),
          ]

          failures = []
          for document_path, schema_path in pairs:
              document = json.loads(document_path.read_text(encoding="utf-8"))
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              validator_class = validator_for(schema)
              validator_class.check_schema(schema)
              validator = validator_class(schema, format_checker=FormatChecker())
              errors = sorted(validator.iter_errors(document), key=lambda error: list(error.absolute_path))
              if errors:
                  for error in errors:
                      location = "/".join(str(part) for part in error.absolute_path) or "<root>"
                      failures.append(f"{document_path}:{location}: {error.message}")
              else:
                  print(f"SCHEMA_PASS document={document_path} schema={schema_path}")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"SCHEMA_RESULT pass=true documents={len(pairs)}")
          PY

      - name: Run the public tiny end-to-end fixture
        run: |
          set -euo pipefail
          test ! -e "$TINY_E2E_DIR"
          scripts/handoff/run_tiny_public_e2e.sh \
            --source-repository "$GITHUB_WORKSPACE" \
            --revision "$GITHUB_SHA" \
            --work-dir "$TINY_E2E_DIR" \
            --jobs 2
          .venv/bin/python - "$TINY_E2E_DIR/tiny_public_e2e_receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt_path = Path(sys.argv[1])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("clean_clone_e2e_pass") is not True:
              raise SystemExit(f"clean immutable-clone E2E gate failed: {receipt_path}")
          print(f"CLEAN_CLONE_E2E_RESULT pass=true receipt={receipt_path}")
          PY

      - name: Preserve portable CI receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handoff-portable-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.CI_RECEIPT_DIR }}/pip-freeze.txt
            ${{ env.CI_RECEIPT_DIR }}/versions.txt
            ${{ env.TINY_E2E_DIR }}/tiny_public_e2e_receipt.json
            ${{ env.TINY_E2E_DIR }}/run_command.txt
            ${{ env.TINY_E2E_DIR }}/inter_sub_mod.log
